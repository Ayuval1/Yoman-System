<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover — בלעדיו התוכן נחתך מתחת לסרגל הבית של האייפון -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מערכת יומן</title>

<!-- ============================================================
     האייקון — התג היחיד ש-iOS קורא בפועל.
     ⚠️ iOS מתעלם מ-icons שב-manifest.json. אל תסתמך עליו.
     ⚠️ המטמון של התג הזה נקבע ברמת הדומיין ושורד מחיקה והוספה
        מחדש של הקיצור. לכן: לא מתקינים על מסך הבית לפני
        שהאייקון הסופי כבר בשרת.
     ============================================================ -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="manifest" href="/manifest.json">

<!-- מסך מלא בלי סרגלי ספארי, כשמופעל ממסך הבית -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מערכת יומן">
<meta name="theme-color" content="#0A7A36">

<link rel="stylesheet" href="/tokens.css">
<style>
  /* ============================================================
     מסך הצ'אט (שלב 8.2א-2). המקור: docs/02-rules/03-design-rules.md
     וההדמיות ב-docs/04-design/08-design-mockups.md (s_main_light, s_main_dark, states)
     וב-docs/04-design/09-design-mockups-layer4.md (fwd-tab, buttons).
     ============================================================ */

  /* ערכים מההדמיות שאין להם טוקן ב-tokens.css. מוגדרים כאן כמשתנים, בהיר וכהה,
     כדי שמצב כהה לא יישבר בשקט. הערכים הועתקו מההדמיות, לא הומצאו. */
  :root {
    --me-grad: linear-gradient(165deg, #1AB455, var(--live));   /* s_main_light .me */
    --btn-neutral: #EFF1F3;                                     /* buttons.html (א), s_main_light .no */
    --cnt-text: #fff;                                           /* s_main_light .cnt */
    --send-bg: var(--deep);                                     /* s_main_light .send */
    --inputbar-bg: rgba(237, 241, 243, .9);                     /* s_main_light .inputbar */
    --field-bg: var(--card);                                    /* s_main_light .field */
    --field-sh: 0 2px 7px rgba(8, 52, 30, .07);                 /* s_main_light .field */
    --sh-peek3: 0 7px 14px rgba(8, 52, 30, .07);                /* s_main_light .p3 */
    --accent: var(--deep);                                      /* תוויות ירוקות ("נרשם", "עוד ›") */
    --r-mini: 18px;                                             /* states.html .mini */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --me-grad: linear-gradient(165deg, #179A47, #12853C);     /* s_main_dark .me */
      --sh-me: 0 5px 14px rgba(0, 0, 0, .4);
      --btn-neutral: rgba(235, 245, 238, .10);                  /* s_main_dark .no */
      --cnt-text: #1A1509;
      --send-bg: #12803A;
      --inputbar-bg: rgba(16, 22, 19, .9);
      --field-bg: var(--card1);
      --field-sh: 0 2px 8px rgba(0, 0, 0, .4);
      --sh-peek: 0 8px 16px rgba(0, 0, 0, .45);
      --sh-peek3: 0 8px 16px rgba(0, 0, 0, .45);
      --sh-card2: 0 6px 16px rgba(0, 0, 0, .42);
      --accent: var(--accent-on-dark);                          /* #54CC85, 03-design-rules "מצב כהה" */
    }
  }
  :root[data-theme="dark"] {
    --me-grad: linear-gradient(165deg, #179A47, #12853C);
    --sh-me: 0 5px 14px rgba(0, 0, 0, .4);
    --btn-neutral: rgba(235, 245, 238, .10);
    --cnt-text: #1A1509;
    --send-bg: #12803A;
    --inputbar-bg: rgba(16, 22, 19, .9);
    --field-bg: var(--card1);
    --field-sh: 0 2px 8px rgba(0, 0, 0, .4);
    --sh-peek: 0 8px 16px rgba(0, 0, 0, .45);
    --sh-peek3: 0 8px 16px rgba(0, 0, 0, .45);
    --sh-card2: 0 6px 16px rgba(0, 0, 0, .42);
    --accent: var(--accent-on-dark);
  }

  [hidden] { display: none !important; }

  /* המסך בגובה החלון: הכותרת והכרטיס הנעוץ למעלה, שורת הכתיבה למטה, וההודעות נגללות ביניהם. */
  .app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  .hero {
    flex: none;
    position: relative; z-index: 2; color: #fff;
    padding: calc(env(safe-area-inset-top) + 8px) 24px 44px;
    background: linear-gradient(168deg, var(--deep2) 0%, var(--deep) 66%, #096B2F 100%);
    border-radius: 0 0 var(--r-hero) var(--r-hero);
    box-shadow: var(--sh-hero);
  }
  .hero h1 { font-size: var(--fs-title); font-weight: var(--fw-bold); letter-spacing: -.9px; }
  .hero p  { font-size: 14.5px; opacity: .72; margin-top: 2px; }

  .push-btn {
    margin-top: 12px; border: 0; border-radius: var(--r-pill);
    padding: 8px 16px; font: inherit; font-size: var(--fs-label);
    color: var(--deep); background: #fff; font-weight: var(--fw-med);
  }

  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; opacity: .45; }

  /* ---------- דרגה 1: שאלות ממתינות, נעוץ מתחת לכותרת ועולה עליה (s_main_light .pinwrap) ---------- */
  /* הנחה, לא אומת: תקרת גובה לאזור הנעוץ (58% מהמסך) וגלילה בתוכו, כדי ששאלה עם 7 כפתורים לא תדחק את הצ'אט החוצה. */
  .pinwrap {
    flex: none; position: relative; z-index: 50;
    margin-top: -30px; padding: 0 14px 14px;
    max-height: 58dvh; overflow-y: auto; overscroll-behavior: contain;
  }
  .pinwrap.expanded { margin-top: 14px; }   /* states.html, "ערימה פתוחה" */

  .card1 {
    position: relative; z-index: 3; background: var(--card1);
    border-radius: var(--r-card1); overflow: hidden; box-shadow: var(--sh-card1);
  }
  .chead { display: flex; align-items: center; gap: 8px; padding: 13px 18px; background: var(--amberbg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
  .clbl { font-size: 13px; font-weight: var(--fw-bold); color: var(--amber); }
  .cnt {
    margin-inline-start: auto; font-size: 12px; font-weight: var(--fw-bold);
    color: var(--cnt-text); background: var(--amber); border-radius: var(--r-pill); padding: 2px 10px;
  }
  .ctxt { font-size: 17px; line-height: 1.42; color: var(--label); padding: 17px 18px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .expanded .ctxt { padding-top: 18px; }
  /* הנחה, לא אומת: המראה של שורת "לא הבנתי" / "לא נשלח" בתוך הכרטיס. אין לה הדמיה; ענבר = "דורש אותך". */
  .cnote { font-size: 14px; line-height: 1.4; color: var(--amber); padding: 8px 18px 0; }

  /* כפתורים זה מתחת לזה, ברוחב מלא (buttons.html, אפשרות א'; 03-design-rules "שאלות עם כפתורים") */
  .opts { display: flex; flex-direction: column; gap: 8px; padding: 15px 18px 0; }
  .opt {
    border: 0; text-align: center; padding: 12px 0; border-radius: var(--r-pill);
    font-size: 16px; font-weight: var(--fw-med); background: var(--btn-neutral); color: var(--label);
  }

  /* תיבת הכתיבה שבתוך הכרטיס (D2, אלמנט חדש שאושר 13.10.2026).
     הנחה, לא אומת: המראה לא נקבע. נבחר: קפסולה באותו צבע כמו הכפתורים שמעליה, עם עיגול השליחה של שורת הכתיבה. */
  .qfield {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 18px 17px; padding: 6px; padding-inline-start: 16px;
    background: var(--btn-neutral); border-radius: var(--r-pill);
  }
  .opts:empty + .qfield { margin-top: 15px; }

  /* הערימה (03-design-rules "הערימה"; s_main_light .peek/.more; states.html "ערימה פתוחה") */
  .peek { background: var(--card); border-radius: var(--r-card1); height: 26px; position: relative; }
  .p2 { margin: -16px 12px 0; z-index: 2; box-shadow: var(--sh-peek); }
  .p3 { margin: -16px 26px 0; z-index: 1; box-shadow: var(--sh-peek3); opacity: .9; }
  .more {
    display: block; width: 100%; border: 0; background: none; text-align: center;
    font-size: 13.5px; font-weight: var(--fw-bold); color: var(--accent); padding: 15px 0 0;
  }
  .exhead { display: flex; align-items: center; gap: 8px; padding: 0 6px 9px; }
  .exlbl, .excnt { font-size: 13px; font-weight: var(--fw-bold); color: var(--amber); }
  .excnt { margin-inline-start: auto; }
  .mini {
    width: 100%; border: 0; text-align: start; background: var(--card1);
    border-radius: var(--r-mini); padding: 14px 16px; display: flex; align-items: center; gap: 11px;
    box-shadow: var(--sh-bubble); margin-top: 9px;
  }
  .mini .d { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex: none; }
  .mini .t { flex: 1; min-width: 0; font-size: 16px; color: var(--label); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ch { margin-inline-start: auto; color: var(--label3); font-size: 20px; flex: none; }
  .close { display: block; width: 100%; border: 0; background: none; text-align: center; font-size: 13.5px; font-weight: var(--fw-bold); color: var(--label2); padding: 16px 0 0; }

  /* ---------- רשימת "פתוחות" (שלב 8.6-2, מפרט 60 סעיף 11) ----------
     הנחה, לא אומת: אין הדמיה. נבנה רק מטוקנים ומחלקות קיימות (exhead, mini, dot, cnote, btn-neutral): שורה כמו .mini, עם כפתור "בוצע" בקצה.
     .openrow הוא div ולא כפתור (הלחיצה היא רק על "בוצע"); .ot עמודת טקסט (כותרת ושורת פרטים); .om שורת הפרטים; .odone כפתור "בוצע". */
  .openrow { cursor: default; }
  .openrow .ot { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .openrow .om { font-size: 13px; color: var(--label2); }
  .odone {
    flex: none; border: 0; border-radius: var(--r-pill); padding: 7px 14px;
    font-size: 14px; font-weight: var(--fw-bold); background: var(--btn-neutral); color: var(--accent);
  }

  /* ---------- כרטיס הבריף החי (בנוסף להודעת הבוקר בצ'אט; docs/08-chapter8/68, הכרעת יובל 21.10.2026) ----------
     הנחה, לא אומת: אין הדמיה. נבנה רק מטוקנים ומחלקות קיימות: שורה כמו .mini/.openrow (נקודה, עמודת טקסט .ot עם .om, כפתור .odone), ומסך מלא כמו סיכום היום (.rvscreen, .rvhead, .rvbody, .rvrow).
     .bfcard נוסף רק כדי לבטל את המרווח העליון (הכרטיס ראשון באזור הנעוץ); .bfopen הוא אזור הלחיצה הראשי (כפתור בלי מראה של כפתור). */
  .bfcard { margin-top: 0; margin-bottom: 10px; }
  .bfopen { border: 0; background: none; padding: 0; text-align: start; color: inherit; font: inherit; }
  .bfopen .t { font-weight: var(--fw-bold); }

  /* ---------- כרטיס הבריף: המראה k1 (שונה 25.10.2026 מהגוש הירוק ב2; הדמיות docs/04-design/80 (מסגרת d1) ו-81 (k1); 03-design-rules "כרטיס הבריף היומי: המראה") ----------
     כרטיס אחד: הגוש (.bfblock) שקוף והוא אזור הלחיצה למסך המלא, בו שני אריחים (.bfnum) עם מספר מעל הכיתוב, ומתחתיו גוף עם שורות משימה (.bfbody) ו"ראיתי".
     הצבעים מטוקני --bf-* (tokens.css), שמפנים לטוקנים הקיימים של האפליקציה: הכרטיס כהה כמו האפליקציה במצב כהה (יובל, 25.10, אחרי שראה את k1 הבהיר על האייפון). לא אומת על מכשיר.
     הפניה ישנה: ב2 מ-22.10 (docs/04-design/76-brief-card-mockups.html). */
  .bfcard.bf2 { background: var(--bf-bg); color: var(--bf-fg); border-radius: var(--r-card1); overflow: hidden; box-shadow: var(--sh-card1); }
  .bfblock {
    display: flex; flex-direction: column; gap: 14px; width: 100%; cursor: pointer;
    background: transparent; color: inherit; padding: 16px 20px 20px;
  }
  .bftop { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bf-dim); }
  .bftop .bftime { margin-inline-start: auto; }
  .bfhead { font-size: 30px; line-height: 1.1; font-weight: var(--fw-bold); }
  .bfnums { display: flex; gap: 10px; align-items: stretch; }
  .bfnum { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; background: var(--bf-tile); border-radius: 18px; padding: 14px 16px; }
  .bfn { font-size: 40px; line-height: 1; font-weight: var(--fw-bold); color: var(--bf-num); }
  .bfu { margin-top: 6px; font-size: 16px; font-weight: 600; }
  .bfs { font-size: 13px; color: var(--bf-dim); white-space: nowrap; }
  .bfltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .bfline { font-size: 14px; color: var(--bf-dim); }
  .bfbody { padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .bftask { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--bf-row); border-radius: 16px; font-size: 16px; }
  .bftask .d { width: 7px; height: 7px; border-radius: 50%; background: var(--bf-amber); flex: none; }
  .bftask .t { color: var(--bf-fg); line-height: 1.3; }
  .bftask .odone { background: var(--bf-btn); color: var(--bf-btnfg); }
  .bfseen { border: 0; background: none; padding: 10px 0 2px; font-size: 14px; font-weight: var(--fw-bold); color: var(--bf-dim); text-align: center; }
  /* שורות המשימה משותפות לרשימת "פתוחות" (משטח רגיל) ולכרטיס (משטח בהיר): בתוך הכרטיס הצבעים מטוקני --bf-*, אחרת טקסט בהיר נעלם בנושא כהה (ביקורת נקייה 25.10). */
  .openrow .om.omerr { color: var(--amber); }
  .bftask .om { color: var(--bf-dim); }
  .bftask .om.omerr { color: var(--bf-amber); }

  /* ---------- ההודעות (s_main_light .feed) ---------- */
  .feed {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 15px;
  }
  /* ההודעות יושבות למטה, ליד שורת הכתיבה (בהדמיה: justify-content:flex-end; כאן margin, כדי שהגלילה למעלה לא תיחסם) */
  .feed > :first-child { margin-top: auto; }
  /* פריט בצ'אט לא מתכווץ כשהרשימה ארוכה מהמסך (בלי זה בועה עם overflow:hidden מתכווצת לגובה 0) */
  .feed > * { flex-shrink: 0; }

  /* הבועה של יובל: ירוקה, משמאל (03-design-rules "צדדים בצ'אט") */
  .me {
    align-self: flex-end; max-width: 76%; background: var(--me-grad); color: #fff;
    border-radius: var(--r-card2); padding: 11px 17px; font-size: 17px; line-height: 1.3; box-shadow: var(--sh-me);
  }
  /* הודעה שהועברה: רצועת "הועבר" שנמוגה (fwd-tab.html, אפשרות ב'). #0A7A36 = var(--deep) בבהיר. */
  .me.fwd { max-width: 80%; padding: 0; overflow: hidden; line-height: 1.4; }
  .fade {
    background: linear-gradient(270deg, var(--deep) 0%, var(--deep) 22%, transparent 62%);
    padding: 7px 17px; font-size: 12.5px; font-weight: var(--fw-bold);
    display: flex; align-items: center; gap: 5px; color: rgba(255, 255, 255, .95);
  }
  .fwd .bd { padding: 9px 17px 12px; }
  .metime { align-self: flex-end; font-size: 11.5px; color: var(--label3); margin: -11px 8px 0; }

  /* בועת המערכת: לבנה (כהה במצב כהה), מימין, תווית ירוקה בראשה ושעה ב-LTR בתחתית (03-design-rules "הצורה נגזרת מהתוכן") */
  .sysb {
    align-self: flex-start; max-width: 80%; background: var(--card1); border-radius: var(--r-card2);
    padding: 11px 16px 9px; font-size: 17px; line-height: 1.4; color: var(--label); box-shadow: var(--sh-bubble);
  }
  .sysb .sl { display: block; font-size: 12.5px; font-weight: var(--fw-bold); color: var(--accent); margin-bottom: 2px; }
  .sysb .bt { font-size: 11.5px; color: var(--label3); margin-top: 3px; text-align: left; }

  /* הודעה ארוכה: 6 שורות ראשונות ו"עוד ›" (הכרעת יובל, 35 "לוג פערים", 14.10.2026) */
  .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
  .txt.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6; overflow: hidden; }
  /* הנחה, לא אומת: המראה של "עוד ›" בתוך בועה. אין לו הדמיה; נבחר טקסט מודגש קטן בצבע הבועה עצמה. */
  .more-txt {
    display: block; margin-top: 4px; border: 0; background: none; padding: 0;
    font-size: 13.5px; font-weight: var(--fw-bold); color: inherit; opacity: .85;
  }

  /* היום הראשון: מסך ריק (03-design-rules "היום הראשון"; states.html) */
  .empty { margin: auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px; }
  .emark { width: 64px; height: 64px; opacity: .22; margin-bottom: 20px; }
  .etext { font-size: 16px; color: var(--label2); line-height: 1.55; }
  .ecard { background: var(--card); border-radius: var(--r-card3); box-shadow: var(--sh-card2); margin-top: 26px; width: 100%; overflow: hidden; }
  .erow { display: flex; align-items: baseline; gap: 12px; padding: 13px 18px; text-align: start; position: relative; }
  .erow + .erow::before { content: ""; position: absolute; top: 0; right: 18px; left: 18px; height: 1px; background: var(--sep); }
  .erow .rt { font-size: var(--fs-time); font-weight: var(--fw-bold); color: var(--accent); min-width: 46px; }
  .erow .rb { font-size: 16px; color: var(--label); }

  /* הנחה, לא אומת: שגיאת טעינה. אין לה הדמיה; טקסט משני ו"נסה שוב" בסגנון "עוד ›". */
  .loaderr { align-self: center; text-align: center; font-size: 15px; color: var(--label2); padding: 8px 0; }
  .loaderr .more { padding-top: 6px; }
  .feed > .loaderr:only-child { margin: auto 0; }

  /* ---------- סיכום היום (M.2, 57 סעיפים 2 ו-11). אלמנט חדש: המבנה אושר, המראה הסופי באישור צילום מסך.
     הנחה, לא אומת: אין הדמיה. נבנה רק מטוקנים ומחלקות קיימות (card1, opt, mini, more, cnote, txt). ---------- */
  .txt.clamp.clamp2 { -webkit-line-clamp: 2; line-clamp: 2; }
  .rvscreen {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  .rvhead {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
  }
  .rvhead h2 { font-size: 22px; font-weight: var(--fw-bold); color: var(--label); }
  .rvhead .more { width: auto; margin-inline-start: auto; padding: 10px 0 10px 12px; }
  .rvbody {

// הדף רק מצייר: כל ההחלטות (מה מוצג, אילו כפתורים, המספר) מגיעות מהשרת (api/chat.js, lib/chat-view.js).

const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',

// --- אין שירות-עובד (הכרעת שלב 4א): דחיפה הצהרתית, המערכת מציגה את ההתראה בעצמה ---
// ⚠️ שירות-עובד שמציג התראה בעצמו מבטל את הפורמט ההצהרתי (ממצא 1, docs/05-chapter7/14).

// --- המספר על האייקון ---
// app_badge = הודעות שלא נקראו + פריטים שיובל לא ענה עליהם.
// setAppBadge קובע ערך מוחלט; אין פעולת הגדלה. הספירה היא של השרת.
// איפוס רק ב-clearAppBadge (לא "שליחת 0" מהשרת: זו דחיפה שקטה ואפל לא תומכת).
export async function setBadge(count) {
  if (!('setAppBadge' in navigator) || !('clearAppBadge' in navigator)) return false; // לא נתמך — לא נופלים
  try {
    count > 0 ? await navigator.setAppBadge(count) : await navigator.clearAppBadge();
    return true;
  } catch (err) {
    console.warn('[app] badge נכשל', err);
    return false;
  }
}

// --- הסוד (D1 ב-docs/08-chapter8/35: נשאל פעם אחת לכל מכשיר ונשמר; 401 מוחק ושואל שוב) ---
// ⚠️ הוכרע לפרק 8 בלבד (35, "הסוד בדף האפליקציה"): prompt ו-localStorage. לא מוטמע בקוד, כי דף ווב חושף כל סוד שמוטמע בו.
// הסוד לא נכתב ללוג. אותן פונקציות משמשות את כפתור ההתראות, את "חבר Google" ואת הצ'אט.
// תוספת אחת: כש-localStorage לא זמין, הסוד נשמר בזיכרון עד סגירת הדף, כדי שהצ'אט (שקורא בכל רענון) לא ישאל שוב ושוב.
const SECRET_STORAGE_KEY = 'yoman_intake_secret';
let secretInMemory = null;

function readSecret() {
  try {
    const stored = localStorage.getItem(SECRET_STORAGE_KEY);
    if (stored) return stored;
  } catch { /* אין אחסון */ }
  return secretInMemory;
}

// שואל את יובל. מחזיר את הסוד, או null כשלא הוזן.
function askSecret() {
  const secret = window.prompt('סוד הקליטה');
  if (!secret) return null;
  secretInMemory = secret;
  try { localStorage.setItem(SECRET_STORAGE_KEY, secret); } catch { /* ממשיכים בלי לשמור */ }
  return secret;
}

function forgetSecret() {
  secretInMemory = null;
  try { localStorage.removeItem(SECRET_STORAGE_KEY); } catch { /* */ }
}

// --- הרשמה לדחיפה (בלי שירות-עובד) ---
// מקור: webkit.org/blog/16535 — "window.pushManager" לניהול מנוי בלי שירות-עובד.
// ⚠️ לא אומת: שחובה מחווה של משתמש ב-subscribe עצמו (הפוסט לא אומר). מכאן נקראת רק מלחיצה.
// ⚠️ ב-iOS ההרשאה נדרשת בתוך לחיצה, ורק כשהאפליקציה רצה ממסך הבית.

function urlBase64ToUint8Array(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}

// vapidPublicKey: מחרוזת base64url של המפתח הציבורי (לא סוד). מגיע מהשרת/מתצורה, לא מוטבע כאן.
export async function enablePush(vapidPublicKey) {
  if (!('Notification' in window) || !window.pushManager) return { ok: false, reason: 'לא נתמך במכשיר הזה' };
  if (!vapidPublicKey) return { ok: false, reason: 'חסר מפתח VAPID ציבורי' };

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'ההרשאה לא אושרה' };

  const subscription = await window.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
  });

  const secret = readSecret() || askSecret();
  if (!secret) return { ok: false, reason: 'לא הוזן סוד' };

  const res = await fetch('/api/push-subscribe', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-intake-secret': secret },
    body: JSON.stringify(subscription.toJSON()),
  });
  if (res.status === 401) {
    forgetSecret();
    return { ok: false, reason: 'הסוד לא התקבל' };
  }
  return res.ok ? { ok: true } : { ok: false, reason: 'הרישום נכשל' };
}

// --- הכפתור זמני: מוצג רק כשההתראות עוד לא הופעלו ---
// לא אומת: getSubscription()/permissionState() על window.pushManager. webkit.org/blog/16535 לא מזכיר אותם,
// ו-MDN מתעד getSubscription רק על ServiceWorkerRegistration. לכן הזיהוי הוא Notification.permission בלבד.
// הגבלה: הרשאה שאושרה אבל רישום השרת נכשל (למשל סוד שגוי) יסתיר את הכפתור בטעינה הבאה.
const pushBtn = document.getElementById('enablePush');
const pushAlreadyOn = () => 'Notification' in window && Notification.permission === 'granted';
if (pushAlreadyOn()) pushBtn.hidden = true;

pushBtn.addEventListener('click', async () => {
  try {
    const keyRes = await fetch('/api/vapid-public-key');
    if (!keyRes.ok) {
      pushBtn.textContent = 'לא הצלחתי: המפתח לא התקבל מהשרת';
      return;
    }
    const result = await enablePush((await keyRes.text()).trim());
    if (result.ok) pushBtn.hidden = true;
    else pushBtn.textContent = 'לא הצלחתי: ' + result.reason;
  } catch (err) {
    console.warn('[app] הפעלת התראות נכשלה', err);
    pushBtn.textContent = 'לא הצלחתי להפעיל התראות';
  }
});

// --- חיבור ל-Google Calendar (שלב 5א) ---
// אותו מנגנון סוד כמו כפתור ההתראות (prompt + localStorage). השרת מחזיר { url } של דף ההסכמה, ועוברים אליו.
// ⚠️ לא נבדק במכשיר: הכפתור נשאר גלוי תמיד (אין דרך לדעת מכאן אם כבר מחוברים).
const googleBtn = document.getElementById('connectGoogle');
googleBtn.addEventListener('click', async () => {
  try {
    const secret = readSecret() || askSecret();
    if (!secret) { googleBtn.textContent = 'לא הוזן סוד'; return; }
    const res = await fetch('/api/google-auth-start', { method: 'POST', headers: { 'x-intake-secret': secret } });
    if (res.status === 401) {
      forgetSecret();
      googleBtn.textContent = 'לא הצלחתי: הסוד לא התקבל';
      return;
    }
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.url) {
      googleBtn.textContent = 'לא הצלחתי: ' + (data?.message ?? 'שגיאה');
      return;
    }
    // מנווטים רק לדף ההסכמה של Google.
    if (!data.url.startsWith('https://accounts.google.com/')) {
      googleBtn.textContent = 'לא הצלחתי: כתובת לא צפויה';
      return;
    }
    window.location.href = data.url;
  } catch (err) {
    console.warn('[app] חיבור Google נכשל', err);
    googleBtn.textContent = 'לא הצלחתי להתחיל חיבור';
  }
});

const ICON_SEND = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>';

// --- בקשה עם הסוד. 401: מוחקים את הסוד, שואלים שוב, ומנסים פעם אחת נוספת (D1). השרת דוחה 401 לפני שהוא שומר משהו, ולכן הניסיון החוזר לא כופל. ---
class NoSecretError extends Error {}
async function authedFetch(url, init = {}) {
  let res;
  for (let attempt = 0; attempt < 2; attempt++) {
    const secret = readSecret() || askSecret();
    if (!secret) throw new NoSecretError('no secret');
    res = await fetch(url, { ...init, headers: { ...(init.headers ?? {}), 'x-intake-secret': secret } });
    if (res.status !== 401) return res;
    forgetSecret();
  }
  return res;
}

function postChat(body) {

// --- שעה ---
// הנחה, לא אומת: היום = "09:12"; אתמול = "אתמול 09:12" (כמו states.html "שתיקה"); לפני כן = "13.10 09:12". אין במסמכים פורמט לתאריך ישן יותר.
const pad2 = (n) => String(n).padStart(2, '0');
function timeLabel(iso) {
  if (!iso) return '';
  const at = new Date(iso);
  if (Number.isNaN(at.getTime())) return '';
  const hm = `${pad2(at.getHours())}:${pad2(at.getMinutes())}`;
  const today = new Date();
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (sameDay(at, today)) return hm;
  const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
  if (sameDay(at, yesterday)) return 'אתמול ' + hm;
  return `${at.getDate()}.${at.getMonth() + 1} ${hm}`;
}

function timeNode(className, iso) {
  const node = el('div', className, timeLabel(iso));
  node.dir = 'ltr'; // שעה תמיד משמאל לימין
  node.classList.add('tnum');
  return node;
}

// --- טקסט של בועה: עד 6 שורות, ואם יש יותר: "עוד ›" ---
const clampQueue = [];
// lines=2 ו-label: לסיכום היום (57, Q2): שתי שורות ו"הצג הכול ›". ברירת המחדל: 6 שורות ו"עוד ›".
function textBlock(text, key, { lines, label } = {}) {
  const node = el('div', 'txt', text ?? '');
  if (!state.expanded.has(key)) {
    node.classList.add('clamp');
    if (lines === 2) node.classList.add('clamp2');
    clampQueue.push({ node, key, label });
  }
  return node;
}

// נבדק אחרי שהבועות כבר בדף (אחרת אין מידות). רק בועה שבאמת נחתכה מקבלת "עוד ›".
function applyClamps() {
  for (const { node, key, label } of clampQueue.splice(0)) {
    if (node.scrollHeight <= node.clientHeight + 1) { node.classList.remove('clamp'); continue; }
    const more = el('button', 'more-txt', label ?? 'עוד ›');
    more.type = 'button';
    more.addEventListener('click', () => {
      state.expanded.add(key);
      node.classList.remove('clamp');
      more.remove();
    });
    node.after(more);
  }
}

// --- בועות ---
function userBubble(item) {
  const key = 'u:' + item.id;
  let bubble;
  if (item.forwarded) {
    bubble = el('div', 'me fwd');
    const strip = el('div', 'fade');
    strip.append(icon(ICON_FORWARD), document.createTextNode('הועבר'));
    const body = el('div', 'bd');
    body.append(textBlock(item.text, key));
    bubble.append(strip, body);
  } else {
    bubble = el('div', 'me');
    bubble.append(textBlock(item.text, key));
  }
  return [bubble, timeNode('metime', item.at)];
}

function systemBubble(item) {
  const key = 's:' + item.id;
  const bubble = el('div', 'sysb');
  let text = item.text ?? '';
  if (item.tag === 'recorded') {
    bubble.append(el('span', 'sl', 'נרשם'));
    text = text.replace(/^נרשם(\s*·\s*)?/, '');
  }
  bubble.append(textBlock(text, key), timeNode('bt', item.at));
  return [bubble];
}

// --- מצב ריק: "היום הראשון" (03-design-rules; states.html) ---
function emptyState() {
  const box = el('div', 'empty');
  const mark = icon(ICON_EMPTY);

  for (const [time, label] of [['07:30', 'הבריף הראשון מחר בבוקר'], ['21:00', 'הסגירה הראשונה מחר בערב']]) {
    const row = el('div', 'erow');

    card.append(row);
  }
  box.append(mark, el('p', 'etext', 'שלח לי משהו, או שתף הודעה מווטסאפ'), card);
  return box;

function loadErrorNode() {
  const box = el('div', 'loaderr', LOAD_ERROR_TEXT);
  const retry = el('button', 'more', 'נסה שוב');
  retry.type = 'button';
  retry.addEventListener('click', () => refresh());
  box.append(retry);
  return box;
}

function renderFeed() {
  const nodes = [];
  for (const item of state.items) nodes.push(...(item.role === 'system' ? systemBubble(item) : userBubble(item)));
  if (state.loadError) nodes.push(loadErrorNode());
  else if (state.loaded && state.items.length === 0 && state.pending.length === 0) nodes.push(emptyState());
  feedEl.replaceChildren(...nodes);
  applyClamps();
  feedEl.scrollTop = feedEl.scrollHeight;
}

// --- שאלות ממתינות: כרטיס נעוץ, ערימה, רשימה מורחבת ---
function questionCard(question, { withHead, count }) {
  const card = el('section', 'card1');
  const busy = state.busy.has(question.id);
  if (withHead) {
    const head = el('div', 'chead');
    head.append(el('span', 'dot'), el('span', 'clbl', 'ממתין לתשובה'), el('span', 'cnt tnum', count));
    card.append(head);
  }
  card.append(el('div', 'ctxt', question.text ?? ''));
  const note = state.notes.get(question.id);
  if (note) {
    const noteEl = el('div', 'cnote', note);
    noteEl.setAttribute('role', 'status');
    card.append(noteEl);
  }

  // הכפתורים בסדר שהשרת מחזיר ("לא יודע" אחרון).
  const opts = el('div', 'opts');
  for (const label of Array.isArray(question.buttons) ? question.buttons : []) {
    const button = el('button', 'opt', label);
    button.type = 'button';
    button.disabled = busy;
    button.addEventListener('click', () => sendAnswer(question.id, String(label)));
    opts.append(button);
  }
  card.append(opts);

  // תיבת הכתיבה שבכרטיס (D2). מופיעה רק כשהשרת מאשר כתיבה חופשית.
  if (question.allowFreeText !== false) {
    const form = el('form', 'qfield');
    const input = el('input');
    input.placeholder = 'תשובה'; // הנחה, לא אומת: אין נוסח במסמכים
    input.autocomplete = 'off';
    input.setAttribute('enterkeyhint', 'send');
    input.value = state.drafts.get(question.id) ?? '';
    input.readOnly = busy;
    input.addEventListener('input', () => state.drafts.set(question.id, input.value));
    const send = el('button', 'send');
    send.type = 'submit';
    send.disabled = busy;
    send.setAttribute('aria-label', 'שלח');
    send.append(icon(ICON_SEND));
    form.append(input, send);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const answer = input.value.trim();
      if (!answer) return; // שדה ריק: לא שולחים
      sendAnswer(question.id, answer);
    });
    card.append(form);
  } else {
    opts.style.paddingBottom = '17px';
  }
  return card;
}

// --- שאלת שיעורי בית (שלב 8.6-2, מפרט 60 "מה אתה רואה" א, סעיפים 6 ו-14) ---
// כרטיס נפרד מ-questionCard: הכפתורים שלו הם אובייקטים ({ due, date }) ולא טקסט, אין בו "לא יודע" ואין תיבת תשובה חופשית (רק שדה הנושא).
// התשובה היא פעולת homework בלבד. הטקסט נגזר בדף מהמקצוע שהשרת שלח; לשרת אין body עם מקצוע.
const HOMEWORK_UNCLEAR_TEXT = 'לא הצלחתי לחשב תאריך. נסה שוב';    // החלטת יובל "א", 19.10.2026 (35 לוג פערים)
const HOMEWORK_PASSED_TEXT = 'השיעור הבא כבר עבר';                // החלטת יובל "א", 19.10.2026: כרטיס בלי כפתור תאריך

// YYYY-MM-DD -> "22.10" (בלי אפס מוביל). ריק כשהפורמט אחר.
function ymdLabel(ymd) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd ?? ''));
  return match ? `${Number(match[3])}.${Number(match[2])}` : '';
}

// רגע (ISO) -> "22.10" לפי היום בישראל (due_at הוא תחילת שיעור בשעון ישראל, נשמר ב-UTC). ריק כשאינו תאריך.
function dueLabel(iso) {
  if (!iso) return '';
  const at = new Date(iso);
  if (Number.isNaN(at.getTime())) return '';
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric' }).formatToParts(at);
    const pick = (type) => parts.find((part) => part.type === type)?.value;
    return `${pick('day')}.${pick('month')}`;
  } catch {
    return '';
  }
}

// הטקסט של שאלה ממתינה, כולל שאלת שיעורי בית (שנגזרת מהמקצוע).
function questionText(question) {
  if (question.kind !== 'homework') return question.text ?? '';
  return question.subject ? `${question.subject}: היו שיעורי בית?` : 'היו שיעורי בית?';
}

// כפתורי התאריך שהכרטיס מציג: רק due:'next' (כפתור יחיד, הכרעת יובל 16.10.2026).
const homeworkDates = (question) => (Array.isArray(question.buttons) ? question.buttons : []).filter((b) => b && b.due === 'next');

function homeworkCard(question, { withHead, count }) {
  const card = el('section', 'card1');
  const busy = state.busy.has(question.id);
  if (withHead) {
    const head = el('div', 'chead');
    head.append(el('span', 'dot'), el('span', 'clbl', 'ממתין לתשובה'), el('span', 'cnt tnum', count));
    card.append(head);
  }
  const dates = homeworkDates(question);

  // אין כפתור תאריך (השיעור הבא כבר עבר): טקסט, וכפתור "סגור" שמסתיר את הכרטיס בדף בלבד. השרת פוקע אותו לבד (expires_at). לא שולחים "לא היו".
  if (dates.length === 0) {
    card.append(el('div', 'ctxt', question.subject ? `${question.subject}: ${HOMEWORK_PASSED_TEXT}` : HOMEWORK_PASSED_TEXT));
    const opts = el('div', 'opts');
    const dismiss = el('button', 'opt', 'סגור');
    dismiss.type = 'button';
    dismiss.addEventListener('click', () => {
      state.dismissed.add(question.id);
      if (state.focusId === question.id) state.focusId = null;
      render();
    });
    opts.append(dismiss);
    opts.style.paddingBottom = '17px';
    card.append(opts);
    return card;
  }

  card.append(el('div', 'ctxt', questionText(question)));
  const note = state.notes.get(question.id);
  if (note) {
    const noteEl = el('div', 'cnote', note);
    noteEl.setAttribute('role', 'status');
    card.append(noteEl);
  }

  // שדה הנושא (אופציונלי): נשמר ב-drafts כמו תיבות הכתיבה האחרות, כדי שלא יימחק ברענון.
  const field = el('div', 'qfield');
  field.style.marginBottom = '0';
  const input = el('input');
  input.placeholder = 'מה למדתם?';
  input.autocomplete = 'off';
  input.maxLength = 200; // תקרת השרת (MAX_TOPIC_LENGTH ב-lib/chat-view.js)
  input.value = state.drafts.get(question.id) ?? '';
  input.readOnly = busy;
  input.addEventListener('input', () => state.drafts.set(question.id, input.value));
  field.append(input);
  card.append(field);

  // בלי ברירת מחדל מסומנת. שלב ראשון: "לא היו" ו"היו שיעורי בית". אחרי "היו": כפתור התאריך (ו"חזרה").
  const opts = el('div', 'opts');
  const button = (label, onClick) => {
    const node = el('button', 'opt', label);
    node.type = 'button';
    node.disabled = busy;
    node.addEventListener('click', onClick);
    opts.append(node);
  };
  if (!state.hwAsk.has(question.id)) {
    button('לא היו', () => sendHomework(question.id, false));
    button('היו שיעורי בית', () => { state.hwAsk.add(question.id); renderPending(); });
  } else {
    for (const date of dates) {
      const label = ymdLabel(date.date);
      button(label ? `השיעור הבא (${label})` : 'השיעור הבא', () => sendHomework(question.id, true));
    }
    // הנחה, לא אומת: "חזרה" (כמו ב-reviewRow) כדי שאפשר יהיה לבחור "לא היו" אחרי לחיצה בטעות. המפרט לא קובע.
    button('חזרה', () => { state.hwAsk.delete(question.id); renderPending(); });
  }
  opts.style.paddingBottom = '17px';
  card.append(opts);
  return card;
}

// הכרטיס הנכון לפי סוג השאלה: שיעורי בית לא עוברים דרך questionCard (כפתורי טקסט וכתיבה חופשית).
const cardFor = (question, options) => (question.kind === 'homework' ? homeworkCard(question, options) : questionCard(question, options));

// שורת משימה פתוחה אחת (כותרת, פרטים, הערת שגיאה, "בוצע"): משותפת לרשימת "פתוחות" ולגוף כרטיס הבריף. rowClass: 'mini openrow' ברשימה, 'bftask openrow' בכרטיס.
function openTaskRow(task, rowClass) {
  const busy = state.busy.has(task.id);
  const row = el('div', rowClass);
  const text = el('span', 'ot');
  text.append(el('span', 't', task.title ?? ''));
  const due = dueLabel(task.due_at);
  // הנחה, לא אומת: שורת הפרטים ("עד 22.10 · תמונה אחת"). המפרט קובע רק "תמונה אחת"; יותר מתמונה אחת (8.6-3 לא מאפשר) מוצג כמספר.
  const meta = [];
  if (due) meta.push('עד ' + due);
  if (task.media_count === 1) meta.push('תמונה אחת');
  else if (task.media_count > 1) meta.push(`${task.media_count} תמונות`);
  if (meta.length > 0) text.append(el('span', 'om', meta.join(' · ')));
  const note = state.notes.get(task.id);
  if (note) {
    const noteEl = el('span', 'om omerr', note);
    noteEl.setAttribute('role', 'status');
    text.append(noteEl);
  }
  const done = el('button', 'odone', 'בוצע');
  done.type = 'button';
  done.disabled = busy;
  done.addEventListener('click', () => sendTaskDone(task.id));
  row.append(el('span', 'd'), text, done);
  return row;
}

// רשימת "פתוחות" (שלב 8.6-2, מפרט 60 סעיף 11 ותרחיש ד): כותרת ושורה לכל פריט, עם "בוצע". ריקה = אין צמתים.
function openTasksNodes(spaced) {
  const list = Array.isArray(state.open_tasks) ? state.open_tasks : [];
  if (list.length === 0) return [];
  const head = el('div', 'exhead');
  if (spaced) head.style.paddingTop = '14px';
  head.append(el('span', 'dot'), el('span', 'exlbl', 'פתוחות'), el('span', 'excnt tnum', list.length));
  const nodes = [head];
  for (const task of list) nodes.push(openTaskRow(task, 'mini openrow'));
  return nodes;
}

// --- כרטיס הבריף החי (docs/08-chapter8/68, הכרעת יובל 21.10.2026): בנוסף להודעת הבוקר בצ'אט, לא במקומה ---
// הכרטיס בראש האזור הנעוץ מ-07:30 שעון ישראל עד סוף היום (כל יום, גם שבת וחופשה). השרת מחליט אם יש כרטיס (brief = null לפני 07:30); הדף רק מצייר.
// הספירות חיות: מ-state.open_tasks ומ-state.pending (בלי שאלות שיובל סגר ב"סגור"), כך ש"בוצע" מעדכן אותן מיד. המסך המלא מציג brief.text מהשרת (טרי אחרי כל תשובה שמחזירה brief).
// "ראיתי" מסתיר את הכרטיס עד מחר 07:30 (גם אם המצב משתנה באותו יום). נשמר רק בדפדפן: localStorage לפי תאריך ישראלי, כל גישה בתוך try/catch.
// הנחה, לא אומת: במכשיר אחר או אחרי מחיקת נתוני האתר הכרטיס יופיע שוב. אם localStorage לא זמין, הכרטיס מוסתר עד רענון הדף ואז מופיע שוב.
// הכרטיס אינו נספר במספר על האייקון ואינו משפיע עליו: setBadge מקבל רק את badge מהשרת.
const BRIEF_SEEN_PREFIX = 'brief-seen-';
const FREE_DAY_TEXT = 'יום פנוי: אין בית ספר ואין משימות פתוחות'; // זהה ל-FREE_DAY_LINE ב-lib/brief-view.js (נבדק ב-test/brief-card-screen.test.js)
const bfEl = document.getElementById('bf');
const bfBodyEl = document.getElementById('bfBody');
const bfCloseBtn = document.getElementById('bfClose');

// תשובת שרת -> brief תקין או null (שרת בלי השדה, null, או צורה לא צפויה: הדף נראה כמו היום).
function validBrief(value) {
  if (!value || typeof value !== 'object') return null;
  if (typeof value.dateIso !== 'string' || typeof value.title !== 'string' || typeof value.text !== 'string') return null;
  return {
    dateIso: value.dateIso, title: value.title, text: value.text,
    school: typeof value.school === 'string' && value.school !== '' ? value.school : null,
    exams: Array.isArray(value.exams) ? value.exams.filter((line) => typeof line === 'string' && line !== '') : [],
    freeDay: value.freeDay === true,
    // שדות מספריים/שעות מהשרת (מראה ב2): מספר שלם לא שלילי ושעה HH:MM, אחרת null. שרת ישן בלי השדות: null (הכרטיס חוזר לשורת school הטקסטואלית).
    schoolLessons: Number.isInteger(value.schoolLessons) && value.schoolLessons >= 0 ? value.schoolLessons : null,
    schoolStartsAt: typeof value.schoolStartsAt === 'string' && /^\d{2}:\d{2}$/.test(value.schoolStartsAt) ? value.schoolStartsAt : null,
    schoolEndsAt: typeof value.schoolEndsAt === 'string' && /^\d{2}:\d{2}$/.test(value.schoolEndsAt) ? value.schoolEndsAt : null,
    // true = יום לימודים, false = ידוע שאין בית ספר, null = לא ידוע (מערכת שעות חסרה, או שרת ישן בלי השדה).
    schoolDay: value.schoolDay === true ? true : value.schoolDay === false ? false : null,
  };
}

const briefSeenKey = (dateIso) => BRIEF_SEEN_PREFIX + dateIso;

// מתג בדיקה חד-פעמי (יובל, 25.10): כתובת עם ?showbrief=1 מציגה את הכרטיס גם אחרי "ראיתי". לא נשמר דבר; בכניסה רגילה אין שינוי.
function briefPreviewOn() {
  try { return new URLSearchParams(location.search).get('showbrief') === '1'; } catch { return false; }
}

function briefIsSeen(dateIso) {
  if (briefPreviewOn()) return false;
  if (state.briefSeen === dateIso) return true;
  try { return localStorage.getItem(briefSeenKey(dateIso)) === '1'; } catch { return false; }
}

function markBriefSeen(dateIso) {
  state.briefSeen = dateIso;
  try { localStorage.setItem(briefSeenKey(dateIso), '1'); } catch { /* אין אחסון: מוסתר עד רענון הדף */ }
}

// מסיר מפתחות "ראיתי" של ימים קודמים (הזדמנותי, בכל טעינה שיש בה כרטיס).
function cleanOldBriefKeys(dateIso) {
  try {
    const keep = briefSeenKey(dateIso);
    for (let index = localStorage.length - 1; index >= 0; index--) {
      const key = localStorage.key(index);
      if (key && key.startsWith(BRIEF_SEEN_PREFIX) && key !== keep) localStorage.removeItem(key);
    }
  } catch { /* אין אחסון */ }
}

const taskCountText = (count) => (count === 1 ? 'משימה אחת פתוחה' : `${count} משימות פתוחות`);
const questionCountText = (count) => (count === 1 ? 'שאלה אחת ממתינה' : `${count} שאלות ממתינות`);

// שעת הבריף הקבועה (הבריף מופיע מ-07:30 שעון ישראל; ההדמיה מציגה אותה בקצה שורת הכותרת של הגוש).
const BRIEF_TIME_TEXT = '07:30';

// הרשימה הפתוחה כפי שהכרטיס צריך אותה: המשימה הראשונה (לשורה בגוף) ותאריך היעד הקרוב ביותר (לכיתוב מתחת למספר). הכול מ-state.open_tasks, כך ש"בוצע" מעדכן מיד.
function nearestDueLabel(tasks) {
  let best = null;
  for (const task of tasks) {
    const at = task.due_at ? new Date(task.due_at) : null;
    if (!at || Number.isNaN(at.getTime())) continue;
    if (best === null || at < best) best = at;
  }
  const label = best ? dueLabel(best.toISOString()) : '';
  return label ? 'עד ' + label : '';
}

// מספר גדול, כיתוב מתחתיו ושורה קטנה מתחת לכיתוב (אריח, k1 מ-25.10; ההדמיה: .tile). sub=null: בלי שורה.
function bfNumber(count, unit, sub, ltr) {
  const num = el('span', 'bfnum');
  num.append(el('span', 'bfn tnum', count), el('span', 'bfu', unit));
  if (sub) num.append(el('span', ltr ? 'bfs bfltr tnum' : 'bfs', sub));
  return num;
}

// הכרטיס, או null כשאין (אין brief, או שיובל לחץ "ראיתי" היום). הטקסט נכנס רק דרך textContent (el).
// מבנה (מראה k1, 25.10): גוש שקוף עם שני אריחים שהוא כפתור הפתיחה למסך המלא, וגוף על משטח הכרטיס עם המשימה הראשונה ו"ראיתי". יום לימודים/יום פנוי נקבע מ-brief.school (null = אין יום לימודים), בלי לפרסר את הטקסט.
function briefCard() {
  const brief = state.brief;
  if (!brief || briefIsSeen(brief.dateIso)) return null;
  const tasks = Array.isArray(state.open_tasks) ? state.open_tasks : [];
  const openCount = tasks.length;
  const questionCount = state.pending.filter((question) => !state.dismissed.has(question.id)).length;
  const schoolDay = brief.school !== null;

  const card = el('div', 'bfcard bf2');
  const block = el('button', 'bfopen bfblock');
  block.type = 'button';
  block.setAttribute('aria-label', 'פתח את הבריף המלא');
  const top = el('span', 'bftop');
  top.append(el('span', '', 'הבריף של היום'), el('time', 'bftime tnum', BRIEF_TIME_TEXT));
  // "יום פנוי" רק כשהשרת יודע שאין בית ספר (schoolDay === false). לא ידוע (מערכת שעות חסרה) או שרת ישן בלי השדה: יום לימודים אם יש שורת school, אחרת כותרת הבריף עצמה, בלי טענה שאין מקור לה.
  const headText = typeof brief.schoolDay === 'boolean' ? (brief.schoolDay ? 'יום לימודים' : 'יום פנוי')
    : schoolDay ? 'יום לימודים' : brief.freeDay ? 'יום פנוי' : brief.title;
  block.append(top, el('span', 'bfhead', headText));

  const nums = el('span', 'bfnums');
  if (schoolDay && brief.schoolLessons !== null) {
    const hours = brief.schoolStartsAt && brief.schoolEndsAt ? `${brief.schoolStartsAt}–${brief.schoolEndsAt}` : '';
    nums.append(bfNumber(brief.schoolLessons, brief.schoolLessons === 1 ? 'שיעור' : 'שיעורים', hours, true));
  }
  if (openCount > 0) nums.append(bfNumber(openCount, openCount === 1 ? 'משימה' : 'משימות', nearestDueLabel(tasks), false));
  if (nums.childNodes.length > 0) block.append(nums);
  // שרת ישן (בלי שדות המספרים): שורת school הטקסטואלית כמו לפני המראה ב2. יום פנוי בלי כלום: שורת FREE_DAY_TEXT.
  if (schoolDay && brief.schoolLessons === null) block.append(el('span', 'bfline', brief.school));
  else if (!schoolDay && brief.freeDay && openCount === 0 && questionCount === 0 && brief.exams.length === 0) block.append(el('span', 'bfline', FREE_DAY_TEXT));
  for (const examLine of brief.exams) block.append(el('span', 'bfline', examLine));
  if (questionCount > 0) block.append(el('span', 'bfline', questionCountText(questionCount)));
  block.addEventListener('click', openBrief);
  card.append(block);

  const body = el('div', 'bfbody');
  for (const task of tasks) body.append(openTaskRow(task, 'bftask openrow')); // שורה לכל משימה (הכרעת יובל, 22.10); האזור הנעוץ גולל מעל 58dvh
  const seen = el('button', 'bfseen', 'ראיתי');
  seen.type = 'button';
  seen.addEventListener('click', () => {
    markBriefSeen(brief.dateIso);
    if (state.bfOpen) closeBrief();
    renderPending();
  });
  body.append(seen);
  card.append(body);
  return card;
}

function renderBriefScreen() {
  if (!state.bfOpen) return;
  if (!state.brief) { closeBrief(); return; } // השרת כבר לא מחזיר בריף (למשל עבר חצות): סוגרים
  const row = el('div', 'rvrow');
  row.append(el('div', 'txt', state.brief.text));
  bfBodyEl.replaceChildren(row);
}

function openBrief() {
  if (!state.brief) return;
  state.bfOpen = true;
  bfEl.hidden = false;
  bfBodyEl.scrollTop = 0;
  renderBriefScreen();
  bfCloseBtn.focus();
}

function closeBrief() {
  state.bfOpen = false;
  bfEl.hidden = true;
  bfBodyEl.replaceChildren();
}
bfCloseBtn.addEventListener('click', closeBrief);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.bfOpen) closeBrief(); });

function renderPending() {
  // שאלות שיעורי בית שיובל סגר ב"סגור" (בלי כפתור תאריך) מוסתרות בדף בלבד.
  const list = state.pending.filter((question) => !state.dismissed.has(question.id));
  const hasReview = state.review.total > 0;
  const hasOpen = Array.isArray(state.open_tasks) && state.open_tasks.length > 0;
  const briefNode = briefCard(); // כרטיס הבריף החי: ראשון באזור הנעוץ, מעל השאלות, פס הסיכום ורשימת הפתוחות
  const hasBrief = briefNode !== null;
  if (list.length === 0 && !hasReview && !hasOpen && !hasBrief) {
    pinEl.hidden = true;
    pinEl.replaceChildren();
    state.stackOpen = false;
    return;
  }
  pinEl.hidden = false;
  if (list.length === 0) {
    // בלי שאלות פתוחות: הפס של סיכום היום (אם יש) ורשימת הפתוחות (אם יש, ולא כשהכרטיס מוצג: המשימות בתוכו).
    state.stackOpen = false;
    pinEl.classList.remove('expanded');
    pinEl.replaceChildren(...(hasBrief ? [briefNode] : []), ...(hasReview ? [reviewStrip()] : []), ...(hasBrief ? [] : openTasksNodes(hasReview)));
    return;
  }
  const current = list.find((q) => q.id === state.focusId) ?? list[0];
  const others = list.filter((q) => q !== current);
  if (others.length === 0) state.stackOpen = false;
  pinEl.classList.toggle('expanded', state.stackOpen);

  const nodes = hasBrief ? [briefNode] : [];
  if (state.stackOpen) {
    // מורחב (states.html "ערימה פתוחה"): הכרטיס הראשון מלא, השאר שורה אחת עם נקודת ענבר וחץ, ו"סגור".
    const head = el('div', 'exhead');
    head.append(el('span', 'dot'), el('span', 'exlbl', 'ממתין לתשובה'), el('span', 'excnt tnum', list.length));
    nodes.push(head, cardFor(current, { withHead: false }));
    for (const question of others) {
      const row = el('button', 'mini');
      row.type = 'button';
      row.append(el('span', 'd'), el('span', 't', questionText(question)), el('span', 'ch', '‹'));
      // הנחה, לא אומת: לחיצה על שורה פותחת את השאלה הזו בכרטיס. המסמכים לא קובעים מה הלחיצה עושה.
      row.addEventListener('click', () => {
        state.focusId = question.id;
        state.stackOpen = false;
        renderPending();
      });
      nodes.push(row);
    }
    const close = el('button', 'close', 'סגור');
    close.type = 'button';
    close.addEventListener('click', () => { state.stackOpen = false; renderPending(); });
    nodes.push(close);
  } else {
    // סגור (03-design-rules "הערימה"): כרטיס אחד פתוח, השאר נערמים מתחתיו, ו"עוד N ממתינים ›".
    nodes.push(cardFor(current, { withHead: true, count: list.length }));
    if (others.length > 0) {
      nodes.push(el('div', 'peek p2'));
      if (others.length > 1) nodes.push(el('div', 'peek p3'));
      // הנחה, לא אומת: ביחיד "עוד 1 ממתין" (המפרט כותב "עוד N ממתינים").
      const more = el('button', 'more', others.length === 1 ? 'עוד 1 ממתין ›' : `עוד ${others.length} ממתינים ›`);
      more.type = 'button';
      more.addEventListener('click', () => { state.stackOpen = true; renderPending(); });
      nodes.push(more);
    }
  }
  if (hasReview) nodes.push(reviewStrip()); // מתחת לכרטיסי השאלות (57, תרחיש א)
  if (hasOpen && !hasBrief) nodes.push(...openTasksNodes(true)); // רשימת "פתוחות" מתחת לכרטיסים ולפס הסיכום (60 סעיף 11); כל עוד כרטיס הבריף מוצג המשימות בתוכו, ואחרי "ראיתי" הרשימה חוזרת
  pinEl.replaceChildren(...nodes);
}

// --- סיכום היום (M.2, 57): פס בראש הצ'אט ורשימה במסך מלא. הדף רק מצייר; מה ממתין, ומה חוקי, נקבע בשרת. ---
const VERDICT_LABEL = { right: 'נכון', wrong: 'לא נכון', not_event: 'לא אירוע', was_event: 'אירוע' };
const EVENT_TYPES = [
  ['short_day', 'יום מקוצר'], ['cancel', 'ביטול'], ['move', 'הזזה'],
  ['exam', 'מבחן'], ['homework', 'שיעורי בית'], ['room', 'חדר'],
];
const EVENT_TYPE_LABEL = Object.fromEntries(EVENT_TYPES);
const rvEl = document.getElementById('rv');
const rvBodyEl = document.getElementById('rvBody');
const rvCloseBtn = document.getElementById('rvClose');

function reviewStrip() {
  const total = state.review.total;
  const row = el('button', 'mini');
  row.type = 'button';
  // הנחה, לא אומת: ביחיד "הודעה אחת ממתינה לסימון" (57 כותב רק את הרבים).
  const label = total === 1 ? 'סיכום היום · הודעה אחת ממתינה לסימון' : `סיכום היום · ${total} הודעות ממתינות לסימון`;
  row.append(el('span', 'd'), el('span', 't', label), el('span', 'ch', '‹'));
  row.addEventListener('click', openReview);
  return row;
}

function openReview() {
  state.rvOpen = true;
  state.rvRows = [...state.review.items];
  state.rvMarks.clear(); state.rvPicking.clear(); state.rvEditing.clear(); state.rvNotes.clear();
  rvEl.hidden = false;
  rvBodyEl.scrollTop = 0;
  renderReview();
  rvCloseBtn.focus();
}

function closeReview() {
  // סגירה מוחקת את השורות המסומנות מהדף (57, תרחיש ב): אי אפשר לשנות אחרי זה.
  state.rvOpen = false;
  state.rvRows = [];
  state.rvMarks.clear(); state.rvPicking.clear(); state.rvEditing.clear(); state.rvNotes.clear();
  rvEl.hidden = true;
  rvBodyEl.replaceChildren();
  renderPending();
}
rvCloseBtn.addEventListener('click', closeReview);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.rvOpen) closeReview(); });

// מקבל review מהשרת (GET או תשובת check). בזמן שהמסך פתוח: שורות שסומנו נשארות, ושורות חדשות מצטרפות בסוף.
function applyReview(review) {
  const items = Array.isArray(review?.items) ? review.items : [];
  state.review = { total: Number.isFinite(review?.total) ? review.total : items.length, items };
  if (!state.rvOpen) return;
  const fresh = new Map(items.map((item) => [item.outcome_id, item]));
  const kept = [];
  for (const old of state.rvRows) {
    const current = fresh.get(old.outcome_id);
    if (current) { kept.push(current); fresh.delete(old.outcome_id); }
    else if (state.rvMarks.has(old.outcome_id)) kept.push(old);
  }
  state.rvRows = [...kept, ...fresh.values()];
}

function reviewButton(label, onClick, busy) {
  const button = el('button', 'opt', label);
  button.type = 'button';
  button.disabled = busy;
  button.addEventListener('click', onClick);
  return button;
}

function reviewRow(item) {
  const id = item.outcome_id;
  const row = el('div', 'rvrow');
  const busy = state.rvBusy.has(id);
  if (item.view === 'recorded') {
    if (item.result) row.append(el('div', 'rvres', item.result));
    if (Array.isArray(item.missing) && item.missing.length > 0) row.append(el('div', 'cnote', 'חסר: ' + item.missing.join(', ')));
  }
  row.append(textBlock(item.text, 'rv:' + id, { lines: 2, label: 'הצג הכול ›' }));

  const mark = state.rvMarks.get(id);
  if (mark && !state.rvEditing.has(id)) {
    // סומן: שורה אחת, ו"שינוי" פותח את הכפתורים מחדש (תרחיש ב; סימון חדש הוא שורה נוספת בשרת, האחרון קובע).
    const type = mark.verdict === 'was_event' && EVENT_TYPE_LABEL[mark.event_type] ? ' · ' + EVENT_TYPE_LABEL[mark.event_type] : '';
    const line = el('div', 'rvmark');
    const change = el('button', 'more-txt', 'שינוי');
    change.type = 'button';
    change.addEventListener('click', () => { state.rvEditing.add(id); state.rvNotes.delete(id); renderReview(); });
    line.append(el('span', null, `סומן: ${VERDICT_LABEL[mark.verdict] ?? ''}${type} ·`), change);
    row.append(line);
    return row;
  }

  const opts = el('div', 'opts');
  if (item.view === 'missed' && state.rvPicking.has(id)) {
    opts.classList.add('rvtypes');
    for (const [type, label] of EVENT_TYPES) opts.append(reviewButton(label, () => sendCheck(id, 'was_event', type), busy));
    const cancel = reviewButton('חזרה', () => { state.rvPicking.delete(id); renderReview(); }, busy);
    cancel.style.gridColumn = '1 / -1';
    opts.append(cancel);
  } else if (item.view === 'missed') {
    opts.append(
      reviewButton('לא אירוע', () => sendCheck(id, 'not_event'), busy),
      reviewButton('זה אירוע', () => { state.rvPicking.add(id); renderReview(); }, busy),
    );
  } else {
    opts.append(
      reviewButton('נכון', () => sendCheck(id, 'right'), busy),
      reviewButton('לא נכון', () => sendCheck(id, 'wrong'), busy),
    );
  }
  row.append(opts);
  const note = state.rvNotes.get(id);
  if (note) {
    const noteEl = el('div', 'cnote', note);
    noteEl.style.paddingTop = '8px';
    noteEl.setAttribute('role', 'status');
    row.append(noteEl);
  }
  return row;
}

function renderReview() {
  if (!state.rvOpen) return;
  const scroll = rvBodyEl.scrollTop;
  const nodes = [];
  if (state.review.total === 0) nodes.push(el('p', 'rvempty', 'אין עוד הודעות לסימון'));
  for (const [view, title] of [['missed', 'לא נתפסו'], ['recorded', 'נרשמו']]) {
    const rows = state.rvRows.filter((item) => item.view === view);
    if (rows.length === 0) continue;
    const waiting = rows.filter((item) => !state.rvMarks.has(item.outcome_id)).length;
    nodes.push(el('h3', 'rvsec', `${title} (${waiting})`));
    for (const item of rows) nodes.push(reviewRow(item));
  }
  rvBodyEl.replaceChildren(...nodes);
  applyClamps(); // אחרי שהשורות בדף: המסך המלא כבר גלוי, אחרת אין מידות
  rvBodyEl.scrollTop = scroll;
}

// סימון: POST check. checked = נכתבה שורה; closed = לא ניתן לסימון עכשיו (פקע, תצוגה השתנתה...), בלי כתיבה: רק מתרענן מהתשובה.
async function sendCheck(outcomeId, verdict, eventType) {
  if (state.rvBusy.has(outcomeId)) return; // לחיצה כפולה
  state.rvBusy.add(outcomeId);
  state.rvNotes.delete(outcomeId);
  renderReview();
  const body = { action: 'check', outcome_id: outcomeId, verdict };
  if (verdict === 'was_event') body.event_type = eventType;
  let data = null;
  try {
    const res = await postChat(body);
    if (!res.ok) throw new Error('check ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] סימון נכשל', err?.name); // בלי טקסט ההודעה
  }
  state.rvBusy.delete(outcomeId);
  if (data?.status === 'checked' || data?.status === 'closed') {
    if (data.status === 'checked') state.rvMarks.set(outcomeId, { verdict, event_type: eventType });
    state.rvPicking.delete(outcomeId);
    state.rvEditing.delete(outcomeId);
    state.rvSeq += 1;
    applyReview(data.review);
    if (Number.isFinite(data.badge)) setBadge(data.badge);
    renderPending();
  } else {
    state.rvNotes.set(outcomeId, ERROR_TEXT);
  }
  renderReview();
}

function render() {
  renderPending();
  renderFeed();
  renderReview();
  renderBriefScreen();
}

// --- רענון: GET, ציור, המספר, ואז "נקרא" על מה שהוצג ---
let refreshing = null;
let refreshAgain = false;
function refresh() {
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = (async () => {
    try {
      do { refreshAgain = false; await loadOnce(); } while (refreshAgain);
    } finally {
      refreshing = null;
    }
  })();
  return refreshing;
}

async function loadOnce() {
  const rvSeqAtStart = state.rvSeq;
  let data;
  try {
    const res = await authedFetch('/api/chat', { cache: 'no-store' });
    if (!res.ok) throw new Error('chat ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] טעינת הצ\'אט נכשלה', err?.name);
    state.loadError = true;
    renderFeed();
    return;
  }
  state.loaded = true;
  state.loadError = false;
  state.items = Array.isArray(data?.items) ? data.items : [];
  state.pending = Array.isArray(data?.pending) ? data.pending : [];
  const reviewStale = state.rvSeq !== rvSeqAtStart;
  if (!reviewStale) applyReview(data?.review);
  const pendingIds = new Set(state.pending.map((q) => q.id));
  for (const id of [...state.notes.keys()]) if (!pendingIds.has(id)) state.notes.delete(id);
  for (const id of [...state.drafts.keys()]) if (!pendingIds.has(id)) state.drafts.delete(id);
  for (const id of [...state.hwAsk]) if (!pendingIds.has(id)) state.hwAsk.delete(id);
  for (const id of [...state.dismissed]) if (!pendingIds.has(id)) state.dismissed.delete(id);
  state.open_tasks = Array.isArray(data?.open_tasks) ? data.open_tasks : []; // 8.6-2: רשימת "פתוחות"
  state.brief = validBrief(data?.brief); // כרטיס הבריף החי; בלי השדה או null: אין כרטיס
  if (state.brief) cleanOldBriefKeys(state.brief.dateIso);
  render();
  if (!reviewStale) await setBadge(Number(data?.badge) || 0);
  await markShownAsRead();
}

// "נקרא": רק בועות המערכת שמוצגות עכשיו ועדיין לא נקראו (47, "החוזה"). אחר כך המספר המעודכן.
async function markShownAsRead() {
  if (document.visibilityState !== 'visible') return;
  const ids = state.items.filter((item) => item.role === 'system' && item.unread).map((item) => item.id);
  if (ids.length === 0) return;
  try {
    const res = await postChat({ action: 'read', message_ids: ids });
    if (!res.ok) return;
    const data = await res.json();
    for (const item of state.items) if (ids.includes(item.id)) item.unread = false;
    await setBadge(Number(data?.badge) || 0);
  } catch (err) {
    console.warn('[app] סימון נקרא נכשל', err?.name);
  }
}

// --- תשובה לשאלה (כפתור או כתיבה) ---
async function sendAnswer(messageId, answer) {
  if (state.busy.has(messageId)) return; // לחיצה כפולה: התשובה הראשונה עוד בדרך
  state.busy.add(messageId);
  state.notes.delete(messageId);
  renderPending();
  let status = null;
  try {
    const res = await postChat({ action: 'answer', message_id: messageId, answer });
    if (!res.ok) throw new Error('answer ' + res.status);
    const data = await res.json();
    status = data?.status;
    if (Number.isFinite(data?.badge)) setBadge(data.badge);
  } catch (err) {
    console.warn('[app] שליחת תשובה נכשלה', err?.name);
  }
  state.busy.delete(messageId);

  if (status === 'unclear') {
    // הכרטיס נשאר, בלי בועה (47 "מה נכנס" 11).
    state.notes.set(messageId, UNCLEAR_TEXT);
    renderPending();
  } else if (status === 'answered' || status === 'closed') {
    // answered: הבחירה הופכת לבועה והשאלה יורדת (D3). closed: השאלה כבר נסגרה, והכרטיס נעלם ברענון.
    state.drafts.delete(messageId);
    if (state.focusId === messageId) state.focusId = null;
    await refresh();
  } else {
    state.notes.set(messageId, ERROR_TEXT);
    renderPending();
  }
}

// --- שאלת שיעורי בית (8.6-2): POST homework. התשובה מחזירה pending, open_tasks ו-badge, והדף מצייר מהם בלי GET נוסף. ---
// מעדכן את הרשימות מתשובת POST (homework / task_done). שדה שחסר בתשובה לא נדרס.
function applyServerLists(data) {
  if (Array.isArray(data?.pending)) {
    state.pending = data.pending;
    const pendingIds = new Set(state.pending.map((q) => q.id));
    for (const id of [...state.notes.keys()]) if (!pendingIds.has(id) && !(state.open_tasks ?? []).some((t) => t.id === id)) state.notes.delete(id);
    for (const id of [...state.drafts.keys()]) if (!pendingIds.has(id)) state.drafts.delete(id);
    for (const id of [...state.hwAsk]) if (!pendingIds.has(id)) state.hwAsk.delete(id);
    for (const id of [...state.dismissed]) if (!pendingIds.has(id)) state.dismissed.delete(id);
  }
  if (Array.isArray(data?.open_tasks)) state.open_tasks = data.open_tasks;
  if (data && 'brief' in data) state.brief = validBrief(data.brief); // בריף טרי אחרי homework / task_done
  if (Number.isFinite(data?.badge)) setBadge(data.badge);
}

async function sendHomework(messageId, had) {
  if (state.busy.has(messageId)) return; // לחיצה כפולה: התשובה הראשונה עוד בדרך
  state.busy.add(messageId);
  state.notes.delete(messageId);
  renderPending();
  const body = { action: 'homework', message_id: messageId, had };
  if (had) body.due = 'next';
  const topic = (state.drafts.get(messageId) ?? '').trim();
  if (topic) body.topic = topic;
  let data = null;
  try {
    const res = await postChat(body);
    if (!res.ok) throw new Error('homework ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] שליחת תשובת שיעורי בית נכשלה', err?.name); // בלי הנושא
  }
  state.busy.delete(messageId);

  if (data?.status === 'unclear') {
    // לא ניתן לחשב תאריך: הכרטיס נשאר, ומוצגת שורה (החלטת יובל "א", 19.10.2026).
    state.notes.set(messageId, HOMEWORK_UNCLEAR_TEXT);
    renderPending();
  } else if (data?.status === 'answered' || data?.status === 'closed') {
    // answered: הכרטיס יורד והמשימה (אם נוצרה) ברשימת הפתוחות. closed: כבר נסגרה, והכרטיס נעלם.
    state.drafts.delete(messageId);
    state.hwAsk.delete(messageId);
    if (state.focusId === messageId) state.focusId = null;
    applyServerLists(data);
    state.pending = state.pending.filter((q) => q.id !== messageId); // גם אם התשובה חסרה pending
    render();
    refresh(); // GET שיצא לפני התשובה וחזר אחריה לא ישאיר את הכרטיס (כמו ב-sendAnswer)
  } else {
    state.notes.set(messageId, ERROR_TEXT);
    renderPending();
  }
}

// --- "בוצע" ברשימת הפתוחות (8.6-2): POST task_done. אין ביטול. ---
async function sendTaskDone(taskId) {
  if (state.busy.has(taskId)) return;
  state.busy.add(taskId);
  state.notes.delete(taskId);
  renderPending();
  let data = null;
  try {
    const res = await postChat({ action: 'task_done', task_id: taskId });
    if (!res.ok) throw new Error('task_done ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] סימון בוצע נכשל', err?.name);
  }
  state.busy.delete(taskId);
  if (data?.status === 'done' || data?.status === 'closed') {
    // closed: המשימה לא קיימת או כבר לא פתוחה; הרשימה מתעדכנת מהתשובה.
    applyServerLists(data);
    state.open_tasks = state.open_tasks.filter((t) => t.id !== taskId); // גם אם התשובה חסרה open_tasks
    render();
    refresh(); // כמו ב-sendHomework: מונע ש-GET ישן ישחזר את הפריט
    return;
  }
  state.notes.set(taskId, ERROR_TEXT);
  render();
}

// --- שורת הכתיבה למטה: הודעה חדשה (D2), נשלחת לנקודת הקליטה עם channel=app ---
let sending = false;
function showComposerNote(text) {
  composerNote.textContent = text;
  composerNote.hidden = !text;
}
msgInput.addEventListener('input', () => showComposerNote(''));

composer.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (sending) return; // הכפתור נעול עד שהשליחה מסתיימת, כדי שלחיצה כפולה לא תרשום הודעה פעמיים (35 "לוג פערים", 14.10.2026)
  const text = msgInput.value.trim();
  if (!text) return; // שדה ריק: לא שולחים
  sending = true;
  sendBtn.disabled = true;
  msgInput.readOnly = true;
  showComposerNote('');
  try {
    const res = await authedFetch('/api/intake', {
      method: 'POST',
      body: new URLSearchParams({ text, channel: 'app' }),
    });
    if (res.status === 413) {
      showComposerNote(TOO_LONG_TEXT);
    } else if (!res.ok) {
      showComposerNote(ERROR_TEXT);
    } else {
      msgInput.value = '';
      await refresh();
    }
  } catch (err) {
    // אין רשת, או שלא הוזן סוד: הטקסט נשאר בתיבה.
    console.warn('[app] שליחת הודעה נכשלה', err?.name);
    showComposerNote(ERROR_TEXT);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    msgInput.readOnly = false;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

refresh();
</script>
