  const row = el(total > 0 ? 'button' : 'div', 'mini');
  if (total > 0) row.type = 'button';
  // הנחה, לא אומת: ביחיד "הודעה אחת ממתינה לסימון" (57 כותב רק את הרבים).
  const reviewLabel = total === 1 ? 'סיכום היום · הודעה אחת ממתינה לסימון' : `סיכום היום · ${total} הודעות ממתינות לסימון`;
  const examLine = state.review.examLine;
  // B-3 (68 D11): רק מבחן = שורת המבחן; מבחן והודעות = "<שורת המבחן> · <התווית הקיימת>". בלי הודעות אין מה לסמן, ולכן אין חץ ואין פתיחה של המסך המלא.
  const label = !examLine ? reviewLabel : total > 0 ? `${examLine} · ${reviewLabel}` : examLine;
  row.append(el('span', 'd'), el('span', 't', label));
  if (total > 0) {
    row.append(el('span', 'ch', '‹'));
    row.addEventListener('click', openReview);
  }
  return row;
}

function openReview() {
  state.rvOpen = true;
  state.rvRows = [...state.review.items];
  state.rvMarks.clear(); state.rvPicking.clear(); state.rvEditing.clear(); state.rvNotes.clear();
  rvEl.hidden = false;
  rvBodyEl.scrollTop = 0;
  renderReview();
  rvCloseBtn.focus();
}

function closeReview() {
  // סגירה מוחקת את השורות המסומנות מהדף (57, תרחיש ב): אי אפשר לשנות אחרי זה.
  state.rvOpen = false;
  state.rvRows = [];
  state.rvMarks.clear(); state.rvPicking.clear(); state.rvEditing.clear(); state.rvNotes.clear();
  rvEl.hidden = true;
  rvBodyEl.replaceChildren();
  renderPending();
}
rvCloseBtn.addEventListener('click', closeReview);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.rvOpen) closeReview(); });

// מקבל review מהשרת (GET או תשובת check). בזמן שהמסך פתוח: שורות שסומנו נשארות, ושורות חדשות מצטרפות בסוף.
function applyReview(review) {
  const items = Array.isArray(review?.items) ? review.items : [];
  const examLine = typeof review?.exam_line === 'string' && review.exam_line !== '' ? review.exam_line : null; // B-3
  state.review = { total: Number.isFinite(review?.total) ? review.total : items.length, items, examLine };
  if (!state.rvOpen) return;
  const fresh = new Map(items.map((item) => [item.outcome_id, item]));
  const kept = [];
  for (const old of state.rvRows) {
    const current = fresh.get(old.outcome_id);
    if (current) { kept.push(current); fresh.delete(old.outcome_id); }
    else if (state.rvMarks.has(old.outcome_id)) kept.push(old);
  }
  state.rvRows = [...kept, ...fresh.values()];
}

function reviewButton(label, onClick, busy) {
  const button = el('button', 'opt', label);
  button.type = 'button';
  button.disabled = busy;
  button.addEventListener('click', onClick);
  return button;
}

function reviewRow(item) {
  const id = item.outcome_id;
  const row = el('div', 'rvrow');
  const busy = state.rvBusy.has(id);
  if (item.view === 'recorded') {
    if (item.result) row.append(el('div', 'rvres', item.result));
    if (Array.isArray(item.missing) && item.missing.length > 0) row.append(el('div', 'cnote', 'חסר: ' + item.missing.join(', ')));
  }
  row.append(textBlock(item.text, 'rv:' + id, { lines: 2, label: 'הצג הכול ›' }));

  const mark = state.rvMarks.get(id);
  if (mark && !state.rvEditing.has(id)) {
    // סומן: שורה אחת, ו"שינוי" פותח את הכפתורים מחדש (תרחיש ב; סימון חדש הוא שורה נוספת בשרת, האחרון קובע).
    const type = mark.verdict === 'was_event' && EVENT_TYPE_LABEL[mark.event_type] ? ' · ' + EVENT_TYPE_LABEL[mark.event_type] : '';
    const line = el('div', 'rvmark');
    const change = el('button', 'more-txt', 'שינוי');
    change.type = 'button';
    change.addEventListener('click', () => { state.rvEditing.add(id); state.rvNotes.delete(id); renderReview(); });
    line.append(el('span', null, `סומן: ${VERDICT_LABEL[mark.verdict] ?? ''}${type} ·`), change);
    row.append(line);
    return row;
  }

  const opts = el('div', 'opts');
  if (item.view === 'missed' && state.rvPicking.has(id)) {
    opts.classList.add('rvtypes');
    for (const [type, label] of EVENT_TYPES) opts.append(reviewButton(label, () => sendCheck(id, 'was_event', type), busy));
    const cancel = reviewButton('חזרה', () => { state.rvPicking.delete(id); renderReview(); }, busy);
    cancel.style.gridColumn = '1 / -1';
    opts.append(cancel);
  } else if (item.view === 'missed') {
    opts.append(
      reviewButton('לא אירוע', () => sendCheck(id, 'not_event'), busy),
      reviewButton('זה אירוע', () => { state.rvPicking.add(id); renderReview(); }, busy),
    );
  } else {
    opts.append(
      reviewButton('נכון', () => sendCheck(id, 'right'), busy),
      reviewButton('לא נכון', () => sendCheck(id, 'wrong'), busy),
    );
  }
  row.append(opts);
  const note = state.rvNotes.get(id);
  if (note) {
    const noteEl = el('div', 'cnote', note);
    noteEl.style.paddingTop = '8px';
    noteEl.setAttribute('role', 'status');
    row.append(noteEl);
  }
  return row;
}

function renderReview() {
  if (!state.rvOpen) return;
  const scroll = rvBodyEl.scrollTop;
  const nodes = [];
  if (state.review.examLine) { // B-3: שורת המבחן בראש המסך (textContent דרך el)
    const examRow = el('div', 'rvrow');
    examRow.append(el('p', 'txt', state.review.examLine));
    nodes.push(examRow);
  }
  if (state.review.total === 0) nodes.push(el('p', 'rvempty', 'אין עוד הודעות לסימון'));
  for (const [view, title] of [['missed', 'לא נתפסו'], ['recorded', 'נרשמו']]) {
    const rows = state.rvRows.filter((item) => item.view === view);
    if (rows.length === 0) continue;
    const waiting = rows.filter((item) => !state.rvMarks.has(item.outcome_id)).length;
    nodes.push(el('h3', 'rvsec', `${title} (${waiting})`));
    for (const item of rows) nodes.push(reviewRow(item));
  }
  rvBodyEl.replaceChildren(...nodes);
  applyClamps(); // אחרי שהשורות בדף: המסך המלא כבר גלוי, אחרת אין מידות
  rvBodyEl.scrollTop = scroll;
}

// סימון: POST check. checked = נכתבה שורה; closed = לא ניתן לסימון עכשיו (פקע, תצוגה השתנתה...), בלי כתיבה: רק מתרענן מהתשובה.
async function sendCheck(outcomeId, verdict, eventType) {
  if (state.rvBusy.has(outcomeId)) return; // לחיצה כפולה
  state.rvBusy.add(outcomeId);
  state.rvNotes.delete(outcomeId);
  renderReview();
  const body = { action: 'check', outcome_id: outcomeId, verdict };
  if (verdict === 'was_event') body.event_type = eventType;
  let data = null;
  try {
    const res = await postChat(body);
    if (!res.ok) throw new Error('check ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] סימון נכשל', err?.name); // בלי טקסט ההודעה
  }
  state.rvBusy.delete(outcomeId);
  if (data?.status === 'checked' || data?.status === 'closed') {
    if (data.status === 'checked') state.rvMarks.set(outcomeId, { verdict, event_type: eventType });
    state.rvPicking.delete(outcomeId);
    state.rvEditing.delete(outcomeId);
    state.rvSeq += 1;
    applyReview(data.review);
    if (Number.isFinite(data.badge)) setBadge(data.badge);
    renderPending();
  } else {
    state.rvNotes.set(outcomeId, ERROR_TEXT);
  }
  renderReview();
}

function render() {
  renderQuota();
  renderPending();
  renderFeed();
  renderReview();
  renderBriefScreen();
}

// --- רענון: GET, ציור, המספר, ואז "נקרא" על מה שהוצג ---
let refreshing = null;
let refreshAgain = false;
function refresh() {
  if (refreshing) { refreshAgain = true; return refreshing; }
  refreshing = (async () => {
    try {
      do { refreshAgain = false; await loadOnce(); } while (refreshAgain);
    } finally {
      refreshing = null;
    }
  })();
  return refreshing;
}

async function loadOnce() {
  const rvSeqAtStart = state.rvSeq;
  const attachAtStart = state.attach; // שלב צירוף שנפתח אחרי שה-GET יצא: התשובה הישנה לא מכירה את המשימה החדשה, ולא סוגרת אותו
  let data;
  try {
    const res = await authedFetch('/api/chat', { cache: 'no-store' });
    if (!res.ok) throw new Error('chat ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] טעינת הצ\'אט נכשלה', err?.name);
    state.loadError = true;
    renderFeed();
    return;
  }
  state.loaded = true;
  state.loadError = false;
  state.items = Array.isArray(data?.items) ? data.items : [];
  state.pending = Array.isArray(data?.pending) ? data.pending : [];
  const reviewStale = state.rvSeq !== rvSeqAtStart;
  if (!reviewStale) applyReview(data?.review);
  const pendingIds = new Set(state.pending.map((q) => q.id));
  for (const id of [...state.notes.keys()]) if (!pendingIds.has(id)) state.notes.delete(id);
  for (const id of [...state.drafts.keys()]) if (!pendingIds.has(id)) state.drafts.delete(id);
  for (const id of [...state.hwAsk]) if (!pendingIds.has(id)) state.hwAsk.delete(id);
  for (const id of [...state.dismissed]) if (!pendingIds.has(id)) state.dismissed.delete(id);
  state.open_tasks = Array.isArray(data?.open_tasks) ? data.open_tasks : []; // 8.6-2: רשימת "פתוחות"
  state.images_enabled = data?.images_enabled === true; // 8.6-3; שרת ישן בלי השדה: בלי כפתורי צילום
  const openIds = new Set(state.open_tasks.map((t) => t.id));
  if (state.attach && state.attach === attachAtStart && !openIds.has(state.attach.taskId) && !state.uploading.has(state.attach.taskId)) state.attach = null; // המשימה כבר לא פתוחה
  for (const id of [...state.attachRetry.keys()]) if (!openIds.has(id) && state.attach?.taskId !== id) state.attachRetry.delete(id);
  state.brief = validBrief(data?.brief); // כרטיס הבריף החי; בלי השדה או null: אין כרטיס
  if (state.brief) cleanOldBriefKeys(state.brief.dateIso);
  state.quota = validQuota(data?.quota); // בלי השדה (שרת ישן) או null: אין כרטיס
  googleBtn.hidden = data?.google_connected === true; // "חבר Google" רק כשלא מחוברים, או כשלא ידוע
  render();
  if (!reviewStale) await setBadge(Number(data?.badge) || 0);
  await markShownAsRead();
}

// "נקרא": רק בועות המערכת שמוצגות עכשיו ועדיין לא נקראו (47, "החוזה"). אחר כך המספר המעודכן.
async function markShownAsRead() {
  if (document.visibilityState !== 'visible') return;
  const ids = state.items.filter((item) => item.role === 'system' && item.unread).map((item) => item.id);
  if (ids.length === 0) return;
  try {
    const res = await postChat({ action: 'read', message_ids: ids });
    if (!res.ok) return;
    const data = await res.json();
    for (const item of state.items) if (ids.includes(item.id)) item.unread = false;
    await setBadge(Number(data?.badge) || 0);
  } catch (err) {
    console.warn('[app] סימון נקרא נכשל', err?.name);
  }
}

// --- תשובה לשאלה (כפתור או כתיבה) ---
async function sendAnswer(messageId, answer) {
  if (state.busy.has(messageId)) return; // לחיצה כפולה: התשובה הראשונה עוד בדרך
  state.busy.add(messageId);
  state.notes.delete(messageId);
  renderPending();
  let status = null;
  try {
    const res = await postChat({ action: 'answer', message_id: messageId, answer });
    if (!res.ok) throw new Error('answer ' + res.status);
    const data = await res.json();
    status = data?.status;
    if (Number.isFinite(data?.badge)) setBadge(data.badge);
  } catch (err) {
    console.warn('[app] שליחת תשובה נכשלה', err?.name);
  }
  state.busy.delete(messageId);

  if (status === 'unclear') {
    // הכרטיס נשאר, בלי בועה (47 "מה נכנס" 11).
    state.notes.set(messageId, UNCLEAR_TEXT);
    renderPending();
  } else if (status === 'answered' || status === 'closed') {
    // answered: הבחירה הופכת לבועה והשאלה יורדת (D3). closed: השאלה כבר נסגרה, והכרטיס נעלם ברענון.
    state.drafts.delete(messageId);
    if (state.focusId === messageId) state.focusId = null;
    await refresh();
  } else {
    state.notes.set(messageId, ERROR_TEXT);
    renderPending();
  }
}

// --- שאלת שיעורי בית (8.6-2): POST homework. התשובה מחזירה pending, open_tasks ו-badge, והדף מצייר מהם בלי GET נוסף. ---
// מעדכן את הרשימות מתשובת POST (homework / task_done). שדה שחסר בתשובה לא נדרס.
function applyServerLists(data) {
  if (Array.isArray(data?.pending)) {
    state.pending = data.pending;
    const pendingIds = new Set(state.pending.map((q) => q.id));
    for (const id of [...state.notes.keys()]) if (!pendingIds.has(id) && !(state.open_tasks ?? []).some((t) => t.id === id)) state.notes.delete(id);
    for (const id of [...state.drafts.keys()]) if (!pendingIds.has(id)) state.drafts.delete(id);
    for (const id of [...state.hwAsk]) if (!pendingIds.has(id)) state.hwAsk.delete(id);
    for (const id of [...state.dismissed]) if (!pendingIds.has(id)) state.dismissed.delete(id);
  }
  if (Array.isArray(data?.open_tasks)) state.open_tasks = data.open_tasks;
  if (data && 'brief' in data) state.brief = validBrief(data.brief); // בריף טרי אחרי homework / task_done
  if (Number.isFinite(data?.badge)) setBadge(data.badge);
}

async function sendHomework(messageId, had) {
  if (state.busy.has(messageId)) return; // לחיצה כפולה: התשובה הראשונה עוד בדרך
  state.busy.add(messageId);
  state.notes.delete(messageId);
  renderPending();
  const body = { action: 'homework', message_id: messageId, had };
  if (had) body.due = 'next';
  const topic = (state.drafts.get(messageId) ?? '').trim();
  if (topic) body.topic = topic;
  let data = null;
  try {
    const res = await postChat(body);
    if (!res.ok) throw new Error('homework ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] שליחת תשובת שיעורי בית נכשלה', err?.name); // בלי הנושא
  }
  state.busy.delete(messageId);

  if (data?.status === 'unclear') {
    // לא ניתן לחשב תאריך: הכרטיס נשאר, ומוצגת שורה (החלטת יובל "א", 19.10.2026).
    state.notes.set(messageId, HOMEWORK_UNCLEAR_TEXT);
    renderPending();
  } else if (data?.status === 'answered' || data?.status === 'closed') {
    // answered: הכרטיס יורד והמשימה (אם נוצרה) ברשימת הפתוחות. closed: כבר נסגרה, והכרטיס נעלם.
    // נוצרה משימה (8.6-3): שלב הצירוף, "צילום" ו"דלג". המקצוע נלקח מהשאלה לפני שהיא יורדת מהרשימה.
    if (data.status === 'answered' && data.task_id) {
      const question = state.pending.find((q) => q.id === messageId);
      state.attach = { taskId: data.task_id, subject: typeof question?.subject === 'string' && question.subject !== '' ? question.subject : null };
    }
    state.drafts.delete(messageId);
    state.hwAsk.delete(messageId);
    if (state.focusId === messageId) state.focusId = null;
    applyServerLists(data);
    state.pending = state.pending.filter((q) => q.id !== messageId); // גם אם התשובה חסרה pending
    render();
    refresh(); // GET שיצא לפני התשובה וחזר אחריה לא ישאיר את הכרטיס (כמו ב-sendAnswer)
  } else {
    state.notes.set(messageId, ERROR_TEXT);
    renderPending();
  }
}

// --- שאלת "איזה מקצוע במדעים?" (B-3ב): POST exam. התשובה מחזירה pending, badge ו-review (הפס מתעדכן בשם המקצוע), והדף מצייר מהם בלי GET נוסף. ---
async function sendExam(messageId, answer) {
  if (state.busy.has(messageId)) return; // לחיצה כפולה: התשובה הראשונה עוד בדרך
  state.busy.add(messageId);
  state.notes.delete(messageId);
  renderPending();
  let data = null;
  try {
    const res = await postChat({ action: 'exam', message_id: messageId, answer });
    if (!res.ok) throw new Error('exam ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] שליחת תשובת מקצוע נכשלה', err?.name);
  }
  state.busy.delete(messageId);

  if (data?.status === 'answered' || data?.status === 'closed') {
    // answered: הכרטיס יורד והפס מתעדכן. closed: כבר נסגרה (או פגה), והכרטיס נעלם.
    if (state.focusId === messageId) state.focusId = null;
    applyServerLists(data);
    state.pending = state.pending.filter((q) => q.id !== messageId); // גם אם התשובה חסרה pending
    if (data.review) {
      state.rvSeq += 1; // GET שיצא לפני התשובה לא ידרוס את הפס (כמו ב-check)
      applyReview(data.review);
    }
    render();
    refresh(); // GET שיצא לפני התשובה וחזר אחריה לא ישאיר את הכרטיס (כמו ב-sendHomework)
  } else {
    state.notes.set(messageId, ERROR_TEXT);
    renderPending();
  }
}

// --- "בוצע" ברשימת הפתוחות (8.6-2): POST task_done. אין ביטול. ---
async function sendTaskDone(taskId) {
  if (state.busy.has(taskId)) return;
  state.busy.add(taskId);
  state.notes.delete(taskId);
  renderPending();
  let data = null;
  try {
    const res = await postChat({ action: 'task_done', task_id: taskId });
    if (!res.ok) throw new Error('task_done ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] סימון בוצע נכשל', err?.name);
  }
  state.busy.delete(taskId);
  if (data?.status === 'done' || data?.status === 'closed') {
    // closed: המשימה לא קיימת או כבר לא פתוחה; הרשימה מתעדכנת מהתשובה.
    applyServerLists(data);
    state.open_tasks = state.open_tasks.filter((t) => t.id !== taskId); // גם אם התשובה חסרה open_tasks
    render();
    refresh(); // כמו ב-sendHomework: מונע ש-GET ישן ישחזר את הפריט
    return;
  }
  state.notes.set(taskId, ERROR_TEXT);
  render();
}

// --- חלונית הפעולות של משימה ("⋯", תתי-משימות 22.11.2026) ---
// משימה רגילה: ישר רשימת ההורים האפשריים (לחיצה אחת פחות). תת-משימה: "הוצא מתת-משימה" ו"ביטול".
const SUBTASKS_OFF_TEXT = 'תתי-משימות עוד לא פעילות';
const SUBTASK_INVALID_TEXT = {
  self: 'אי אפשר לקשר משימה לעצמה',
  parent_is_subtask: 'אי אפשר: היא כבר תת-משימה',
  has_subtasks: 'אי אפשר: יש לה תתי-משימות',
};
const SUBTASK_CHANGED_TEXT = 'המשימה השתנתה, נסה שוב';
const tmEl = document.getElementById('tm');
const tmMenu = document.getElementById('tmMenu');

function closeTaskMenu() {
  tmEl.hidden = true;
  tmMenu.replaceChildren();
}

function openTaskMenu(taskId) {
  const tasks = Array.isArray(state.open_tasks) ? state.open_tasks : [];
  const task = tasks.find((item) => item.id === taskId);
  const items = task ? taskMenuItems(task, tasks) : [];
  if (items.length === 0) return;
  const row = (label, onClick, className = 'mm-row') => {
    const node = el('button', className);
    node.type = 'button';
    node.setAttribute('role', 'menuitem');
    node.append(el('span', null, label));
    node.addEventListener('click', onClick);
    return node;
  };
  const head = el('div', 'tm-head');
  head.append(el('div', 'tm-title', task.title ?? ''));
  const rows = [];
  if (items[0] === 'unlink') {
    const parent = tasks.find((item) => item.id === task.parent_task_id);
    if (parent) head.append(el('div', null, `תת-משימה של '${parent.title ?? ''}'`));
    rows.push(row('הוצא מתת-משימה', () => sendSubtask('subtask_unlink', task.id)));
  } else {
    head.append(el('div', null, 'הפוך לתת-משימה של…'));
    for (const parent of subtaskParents(task, tasks)) rows.push(row(parent.title ?? '', () => sendSubtask('subtask_link', task.id, parent.id)));
  }
  rows.push(row('ביטול', closeTaskMenu, 'mm-row tm-cancel'));
  tmMenu.replaceChildren(head, ...rows);
  tmEl.hidden = false;
  tmMenu.scrollTop = 0;
}

document.getElementById('tmBack').addEventListener('click', closeTaskMenu);
tmEl.addEventListener('contextmenu', (event) => event.preventDefault());
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !tmEl.hidden) closeTaskMenu(); });

// POST subtask_link / subtask_unlink. התשובה נושאת open_tasks ו-badge (גם ב-invalid), והדף מצייר מהם.
async function sendSubtask(action, taskId, parentId) {
  closeTaskMenu();
  if (state.busy.has(taskId)) return;
  state.busy.add(taskId);
  render();
  let data = null;
  try {
    const body = action === 'subtask_link' ? { action, task_id: taskId, parent_id: parentId } : { action, task_id: taskId };
    const res = await postChat(body);
    if (!res.ok) throw new Error(action + ' ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] שינוי תת-משימה נכשל', err?.name);
  }
  state.busy.delete(taskId);
  const status = data?.status;
  if (status === 'disabled') {
    showToast(SUBTASKS_OFF_TEXT); // העמודה עוד לא קיימת במסד: לא משנים כלום בדף
    render();
    return;
  }
  if (status === 'linked' || status === 'unlinked' || status === 'closed' || status === 'invalid') {
    applyServerLists(data);
    if (status === 'invalid') showToast(SUBTASK_INVALID_TEXT[data.reason] ?? SUBTASK_CHANGED_TEXT);
    render();
    refresh(); // כמו ב-sendTaskDone: GET ישן לא ישחזר את הסדר הקודם
    return;
  }
  showToast(ERROR_TEXT);
  render();
}

// --- תמונה (8.6-3, מפרט 60 תרחיש ב): צילום או בחירה, הקטנה בדפדפן ל-JPEG, ושליחה ב-POST attach. לא מציגים ולא קוראים את התמונה. ---
const photoInput = document.getElementById('photoInput');
let photoTarget = null; // המשימה שהבורר נפתח בשבילה

// נקרא ישר מתוך הלחיצה: באייפון הבורר נפתח רק מתוך פעולה של המשתמש.
function pickPhoto(taskId) {
  if (!state.images_enabled || state.uploading.has(taskId)) return;
  photoTarget = taskId;
  photoInput.value = '';
  photoInput.click();
}

photoInput.addEventListener('change', async () => {
  const file = photoInput.files?.[0] ?? null;
  const taskId = photoTarget;
  photoTarget = null;
  photoInput.value = ''; // אותה תמונה פעמיים ברצף עדיין יורה change
  if (!file || !taskId || state.uploading.has(taskId)) return;
  state.uploading.add(taskId); // נעילה כבר בזמן ההקטנה, לפני השליחה
  state.notes.delete(taskId);
  state.attachRetry.delete(taskId);
  renderPending();
  let image = null;
  try {
    image = await encodePhoto(file, taskId);
  } catch (err) {
    console.warn('[app] הקטנת התמונה נכשלה', err?.name);
  }
  if (!image) {
    state.uploading.delete(taskId);
    state.notes.set(taskId, PHOTO_READ_ERROR_TEXT);
    renderPending();
    return;
  }
  await sendAttach(taskId, image);
});

// "נסה שוב" אחרי כשל: אותה תמונה מוכנה, בלי לצלם מחדש.
function resendPhoto(taskId) {
  const image = state.attachRetry.get(taskId);
  if (!image || state.uploading.has(taskId)) return;
  state.uploading.add(taskId);
  state.notes.delete(taskId);
  renderPending();
  sendAttach(taskId, image);
}

// קובץ -> תמונה טעונה (Image). ספארי מפענח גם HEIC ומיישר לפי כיוון הצילום (EXIF) כשמציירים.
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, release: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image decode')); };
    img.src = url;
  });
}

// מקטין עד שהצלע הארוכה 1600px לכל היותר, ומוריד איכות (ואחר כך גודל) עד שכל גוף הבקשה בתקרה של השרת.
// מחזיר data URL של JPEG (השרת מקבל עם הקידומת), או null כשלא הצליח להיכנס בתקרה.
async function encodePhoto(file, taskId) {
  const { img, release } = await loadImage(file);
  const canvas = document.createElement('canvas');
  try {
    const width = img.naturalWidth;
    const height = img.naturalHeight;
    if (!width || !height) return null;
    const envelope = JSON.stringify({ action: 'attach', task_id: taskId, image: '' }).length;
    let longSide = PHOTO_LONG_SIDE_PX;
    for (let round = 0; round < 6; round++) {
      const scale = Math.min(1, longSide / Math.max(width, height));
      canvas.width = Math.max(1, Math.round(width * scale));
      canvas.height = Math.max(1, Math.round(height * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; // תמונה שקופה (PNG): רקע לבן במקום שחור ב-JPEG
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      for (const quality of [0.82, 0.7, 0.58, 0.46]) {
        const image = canvas.toDataURL('image/jpeg', quality);
        if (!image.startsWith('data:image/jpeg')) return null;
        if (envelope + image.length <= ATTACH_MAX_BODY_CHARS) return image;
      }
      longSide = Math.round(longSide * 0.75);
    }
    return null;
  } finally {
    canvas.width = 0; // משחרר את הזיכרון של ה-canvas מיד (באייפון יש תקרה לזיכרון של canvas)
    canvas.height = 0;
    release();
  }
}

// POST attach. state.uploading כבר מכיל את המשימה (הקורא נעל).
async function sendAttach(taskId, image) {
  let data = null;
  try {
    const res = await postChat({ action: 'attach', task_id: taskId, image });
    if (!res.ok) throw new Error('attach ' + res.status);
    data = await res.json();
  } catch (err) {
    console.warn('[app] שליחת תמונה נכשלה', err?.name);
  }
  state.uploading.delete(taskId);
  const message = typeof data?.message === 'string' && data.message.trim() !== '' ? data.message : null;

  if (data?.status === 'attached') {
    state.attachRetry.delete(taskId);
    if (state.attach?.taskId === taskId) state.attach = null;
    applyServerLists(data); // open_tasks עם media_count החדש, והמספר
    render();
    showToast(PHOTO_SAVED_TEXT);
  } else if (data?.status === 'closed') {
    // המשימה כבר לא פתוחה: שלב הצירוף נסגר והרשימה מתעדכנת.
    state.attachRetry.delete(taskId);
    if (state.attach?.taskId === taskId) state.attach = null;
    applyServerLists(data);
    state.open_tasks = state.open_tasks.filter((t) => t.id !== taskId);
    render();
    refresh();
  } else if (data?.status === 'disabled') {
    // האחסון לא מחובר בשרת: הכפתורים נעלמים, ובשלב הצירוף נשאר "דלג" עם השורה "תמונות עוד לא מחוברות".
    state.images_enabled = false;
    state.attachRetry.delete(taskId);
    if (state.attach?.taskId !== taskId && message) state.notes.set(taskId, message);
    render();
  } else {
    // failed (ההעלאה נכשלה, אין שורה במסד), 400/500 או אין רשת: הודעה, והתמונה נשמרת בדף ל"נסה שוב".
    if (data?.status === 'failed') applyServerLists(data);
    state.attachRetry.set(taskId, image);
    state.notes.set(taskId, data?.status === 'failed' && message ? message : ERROR_TEXT);
    render();
  }
}

// --- לחיצה ארוכה והחלקה על הודעה (ח-4), בדפוס של וואטסאפ באייפון. הנחה, לא אומת באייפון. ---
const HOLD_MS = 400;          // זמן החזקה עד שהתפריט נפתח
const PRESS_DELAY_MS = 90;    // הבועה מתחילה להתכווץ רק אחרי רגע, כדי שגלילה רגילה לא תכווץ בועות
const HOLD_MOVE_PX = 8;       // תזוזה גדולה מזה מבטלת את ההחזקה: הגלילה מנצחת
const AXIS_LOCK_PX = 10;      // אחרי 10px מחליטים: אופקי = החלקה לתגובה, אנכי = גלילה רגילה
const SWIPE_MAX_PX = 70;      // הבועה זזה עד 70px
const SWIPE_REPLY_PX = 55;    // שחרור אחרי 55px = "הגב"
// כיוון ההחלקה: בוואטסאפ באנגלית (משמאל לימין) מחליקים ימינה. הדף שלנו מימין לשמאל, ולכן ההיפוך: שמאלה (-1).
const SWIPE_DIR = document.documentElement.dir === 'rtl' ? -1 : 1;
const LIFT_EASE = 'cubic-bezier(.2, .9, .3, 1.2)';   // קפיצה קטנה, כמו קפיץ
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const ICON_REPLY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6l6 6-6 6"/><path d="M20 12H9a5 5 0 0 0-5 5v1"/></svg>';
const quoteEl = document.getElementById('quote');
const quoteWho = document.getElementById('quoteWho');
const quoteText = document.getElementById('quoteText');
const mmEl = document.getElementById('mm');
const mmBack = document.getElementById('mmBack');
const mmMenu = document.getElementById('mmMenu');
const toastEl = document.getElementById('toast');
let quoted = null;         // { id, role, text } של ההודעה שמגיבים לה
let mmCurrent = null;      // ההודעה שהשכבה פתוחה עליה
let mmSource = null;       // הבועה המקורית (מוסתרת בזמן שהשכבה פתוחה)
let mmLift = null;         // העותק המורם
let mmOpenedAt = 0;
let mmFingerDown = false;  // האצבע של הלחיצה הארוכה עדיין על המסך
let mmClosing = false;
let gesture = null;        // { bubble, x, y, mode: hold|pending|swipe, pressTimer, holdTimer, offset, moving, icon, anchor }
let toastTimer = null;

function clearQuote() {
  quoted = null;
  quoteEl.hidden = true;
  quoteWho.textContent = '';
  quoteText.textContent = '';
}
document.getElementById('quoteX').addEventListener('click', clearQuote);

// "הגב": משותף לתפריט ולהחלקה
function startReply(meta) {
  quoted = meta;
  const snippet = meta.text.replace(/\s+/g, ' ').trim();
  quoteWho.textContent = meta.role === 'user' ? 'את/ה' : 'המערכת';
  quoteText.textContent = snippet.length > 80 ? snippet.slice(0, 80) + '…' : snippet;
  quoteEl.hidden = true;
  void quoteEl.offsetWidth; // מאפס את האנימציה, גם כשמחליפים ציטוט קיים
  quoteEl.hidden = false;
  msgInput.focus();
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 1400);
}

function animate(node, frames, options) {
  return typeof node.animate === 'function' ? node.animate(frames, options) : null;
}

function openMessageMenu(bubble) {
  const meta = bubbleMeta.get(bubble);
  if (!meta || mmCurrent) return;
  const reduce = reduceMotion.matches;
  const startScale = bubble.classList.contains('pressing') && !reduce ? 0.96 : 1;
  const rect = bubble.getBoundingClientRect();           // אולי מכווץ (pressing): המרכז נכון, הגודל לא
  const width = bubble.offsetWidth;
  let height = bubble.offsetHeight;
  bubble.classList.remove('pressing', 'press-release');
  mmCurrent = meta;
  mmSource = bubble;
  mmOpenedAt = Date.now();

  const lift = bubble.cloneNode(true);
  lift.classList.add('mm-lift');
  lift.inert = true;
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const left = centerX - width / 2;
  const top = centerY - height / 2;
  lift.style.width = width + 'px';
  lift.style.left = left + 'px';
  lift.style.top = top + 'px';
  mmEl.insertBefore(lift, mmMenu);
  mmLift = lift;
  mmEl.hidden = false;

  // גבולות: הריפוד של השכבה (אזורים בטוחים + 12px)
  const box = getComputedStyle(mmEl);
  const padTop = parseFloat(box.paddingTop) || 0;
  const padBottom = parseFloat(box.paddingBottom) || 0;
  const side = parseFloat(box.paddingLeft) || 0;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const menuW = mmMenu.offsetWidth;
  const menuH = mmMenu.offsetHeight;
  const GAP = 8;
  const grow = reduce ? 1 : 1.03;
  // בועה ארוכה מדי: חותכים את העותק כדי שהתפריט ייכנס
  const room = vh - padTop - padBottom - menuH - GAP;
  if (height * grow > room) {
    height = Math.max(60, room / grow);
    lift.style.height = height + 'px';
    lift.style.overflow = 'hidden';
  }
  const extra = (height * grow - height) / 2;
  const shownTop = top - extra;
  const shownBottom = top + height + extra;
  // תפריט מתחת; אם אין מקום, מעל; אם גם אין, מזיזים את הבועה כך שהשניים ייכנסו
  let below = true;
  let shift = 0;
  if (shownTop >= padTop && shownBottom + GAP + menuH <= vh - padBottom) below = true;
  else if (shownBottom <= vh - padBottom && shownTop - GAP - menuH >= padTop) below = false;
  else {
    const maxTop = vh - padBottom - menuH - GAP - (shownBottom - shownTop);
    shift = Math.max(padTop, Math.min(shownTop, maxTop)) - shownTop;
  }
  const menuTop = below ? shownBottom + shift + GAP : shownTop + shift - GAP - menuH;
  const alignLeft = centerX < vw / 2;   // התפריט מיושר לצד של הבועה
  let menuLeft = alignLeft ? left : left + width - menuW;
  menuLeft = Math.min(Math.max(menuLeft, side), vw - side - menuW);
  mmMenu.style.left = menuLeft + 'px';
  mmMenu.style.top = menuTop + 'px';
  mmMenu.style.transformOrigin = `${alignLeft ? 'left' : 'right'} ${below ? 'top' : 'bottom'}`;

  const end = `translateY(${shift}px) scale(${grow})`;
  lift.style.transform = end;
  mmBack.style.opacity = '1';
  mmMenu.style.opacity = '1';
  bubble.classList.add('mm-src');
  if (reduce) {
    // תנועה מופחתת: בלי הרמה ובלי קפיץ, רק דהייה
    const fade = { duration: 150, easing: 'ease-out' };
    for (const node of [mmBack, lift, mmMenu]) animate(node, [{ opacity: 0 }, { opacity: 1 }], fade);
    return;
  }
  lift.style.willChange = 'transform';
  mmMenu.style.willChange = 'transform, opacity';
  animate(mmBack, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
  const liftAnim = animate(lift, [{ transform: `scale(${startScale})` }, { transform: end }], { duration: 340, easing: LIFT_EASE });
  const menuAnim = animate(mmMenu, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 280, delay: 40, easing: LIFT_EASE, fill: 'backwards' });
  Promise.all([liftAnim?.finished, menuAnim?.finished]).then(() => {
    lift.style.willChange = '';
    mmMenu.style.willChange = '';
  }, () => {});
}

function closeMessageMenu() {
  if (!mmCurrent || mmClosing) return;
  mmClosing = true;
  const reduce = reduceMotion.matches;
  const lift = mmLift;
  const source = mmSource;
  const options = { duration: 180, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' };
  const anims = [
    animate(mmBack, [{ opacity: 1 }, { opacity: 0 }], options),
    animate(mmMenu, [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: reduce ? 'none' : 'scale(.7)' }], options),
  ];
  if (reduce) {
    source?.classList.remove('mm-src');
    if (lift) anims.push(animate(lift, [{ opacity: 1 }, { opacity: 0 }], options));
  } else if (lift) {
    lift.style.willChange = 'transform';
    anims.push(animate(lift, [{ transform: lift.style.transform }, { transform: 'none' }], options)); // חוזרת למקום המקורי
  }
  let finished = false;
  const done = () => {
    if (finished) return;
    finished = true;
    for (const anim of anims) anim?.cancel();
    lift?.remove();
    source?.classList.remove('mm-src');
    mmEl.hidden = true;
    mmBack.style.opacity = '';
    mmMenu.style.opacity = '';
    mmCurrent = null;
    mmSource = null;
    mmLift = null;
    mmClosing = false;
  };
  Promise.all(anims.map((anim) => anim?.finished)).then(done, done);
  setTimeout(done, 400); // גיבוי, אם אנימציה לא מסתיימת (למשל דף ברקע)
}

// בועות של יובל ושל המערכת בלבד; לא על כפתורים שבתוך הבועה
function bubbleFromEvent(event) {
  if (event.target.closest('button, a, input')) return null;
  return event.target.closest('.me, .sysb');
}

function releasePress(bubble) {
  if (!bubble.classList.contains('pressing')) return;
  bubble.classList.replace('pressing', 'press-release'); // חוזרת לגודל בקפיץ
  setTimeout(() => bubble.classList.remove('press-release'), 320);
}

function startSwipe(g) {
  g.mode = 'swipe';
  g.offset = 0;
  g.moving = [g.bubble];
  const time = g.bubble.nextElementSibling;
  if (time?.classList.contains('metime')) g.moving.push(time); // השעה זזה עם הבועה
  for (const node of g.moving) { node.style.transition = 'none'; node.style.willChange = 'transform'; }
  const rect = g.bubble.getBoundingClientRect();
  g.anchor = SWIPE_DIR < 0 ? rect.right : rect.left; // הצד שהבועה מתרחקת ממנו
  const ic = document.createElement('div');
  ic.className = 'swipe-ic';
  ic.innerHTML = ICON_REPLY; // סמל קבוע מהקוד, לא טקסט מהשרת
  ic.style.left = g.anchor + 'px';
  ic.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.append(ic);
  g.icon = ic;
}

function moveSwipe(g, pulled) {
  const offset = Math.min(SWIPE_MAX_PX, Math.max(0, pulled - AXIS_LOCK_PX)); // מתחילים מאפס ברגע הנעילה, בלי קפיצה
  g.offset = offset;
  const shiftX = `translateX(${offset * SWIPE_DIR}px)`;
  for (const node of g.moving) node.style.transform = shiftX;
  const progress = Math.min(1, offset / SWIPE_REPLY_PX);
  g.icon.style.opacity = String(progress);
  g.icon.style.transform = `translateX(${SWIPE_DIR * offset / 2}px) scale(${0.5 + 0.5 * progress})`; // במרכז הרווח שנפתח
  g.icon.classList.toggle('armed', offset >= SWIPE_REPLY_PX);
}

function springBack(g) {
  const easing = reduceMotion.matches ? 'ease-out' : LIFT_EASE;
  for (const node of g.moving) { node.style.transition = `transform 260ms ${easing}`; node.style.transform = ''; }
  g.icon.style.transition = 'opacity 160ms ease-out';
  g.icon.style.opacity = '0';
  setTimeout(() => {
    for (const node of g.moving) { node.style.transition = ''; node.style.willChange = ''; }
    g.icon.remove();
  }, 300);
}

// ביטול: ההחזקה נעצרת, הבועה חוזרת לגודל; החלקה באמצע חוזרת למקום בלי "הגב"
function resetGesture() {
  const g = gesture;
  if (!g) return;
  gesture = null;
  clearTimeout(g.pressTimer);
  clearTimeout(g.holdTimer);
  if (g.mode === 'swipe') springBack(g);
  else releasePress(g.bubble);
}

function cancelHold() {
  if (gesture && gesture.mode !== 'swipe') resetGesture();
}

feedEl.addEventListener('touchstart', (event) => {
  resetGesture();
  const bubble = bubbleFromEvent(event);
  if (!bubble || event.touches.length !== 1 || mmCurrent) return;
  const t = event.touches[0];
  feedEl.classList.add('holding'); // בלי סימון טקסט בכל הרשימה עד שהאצבע עולה
  const g = { bubble, x: t.clientX, y: t.clientY, mode: 'hold' };
  g.pressTimer = setTimeout(() => bubble.classList.add('pressing'), PRESS_DELAY_MS);
  g.holdTimer = setTimeout(() => {
    if (gesture !== g || g.mode !== 'hold') return;
    gesture = null;
    clearTimeout(g.pressTimer);
    mmFingerDown = true;
    openMessageMenu(bubble);
    if (mmCurrent) startDragSelect();
  }, HOLD_MS);
  gesture = g;
}, { passive: true });

// לא פסיבי: preventDefault רק אחרי שננעל ציר אופקי. בכל מצב אחר הגלילה של הדפדפן לא נוגעים בה.
feedEl.addEventListener('touchmove', (event) => {
  const g = gesture;
  if (!g) return;
  const t = event.touches[0];
  const dx = t.clientX - g.x;
  const dy = t.clientY - g.y;
  if (g.mode === 'hold') {
    if (Math.abs(dx) <= HOLD_MOVE_PX && Math.abs(dy) <= HOLD_MOVE_PX) return;
    clearTimeout(g.pressTimer);
    clearTimeout(g.holdTimer);
    releasePress(g.bubble);
    g.mode = 'pending';
  }
  if (g.mode === 'pending') {
    if (Math.max(Math.abs(dx), Math.abs(dy)) < AXIS_LOCK_PX) return;
    if (Math.abs(dx) > Math.abs(dy) && dx * SWIPE_DIR > 0) startSwipe(g);
    else { gesture = null; return; } // אנכי (גלילה) או לכיוון השני: לא שלנו
  }
  event.preventDefault();
  moveSwipe(g, dx * SWIPE_DIR);
}, { passive: false });

feedEl.addEventListener('touchend', () => {
  const g = gesture;
  if (g?.mode === 'swipe') {
    gesture = null;
    const reply = g.offset >= SWIPE_REPLY_PX;
    springBack(g);
    const meta = bubbleMeta.get(g.bubble);
    if (reply && meta) startReply(meta);
    return;
  }
  resetGesture();
}, { passive: true });
feedEl.addEventListener('touchcancel', resetGesture, { passive: true });
feedEl.addEventListener('scroll', cancelHold, { passive: true });
// קליק ימני במחשב (ובדיקות), ותפריט הקשר של המערכת במגע: פותחים את אותה שכבה
feedEl.addEventListener('contextmenu', (event) => {
  const bubble = bubbleFromEvent(event);
  if (!bubble) return;
  event.preventDefault();
  resetGesture();
  openMessageMenu(bubble);
});

// --- לחיצה-גרירה-שחרור, כמו בתפריטים של iOS: האצבע שפתחה את התפריט עדיין על המסך, גוררים אותה על השורות,
// השורה שמתחתיה מודגשת, ושחרור על שורה מפעיל אותה מיד. שחרור מחוץ לשורה משאיר את התפריט פתוח (הקשה רגילה). ---
const mmRows = [...mmMenu.querySelectorAll('.mm-row')];
let mmHotRow = null;

function setHotRow(row) {
  if (row === mmHotRow) return;
  mmHotRow = row;
  for (const r of mmRows) r.classList.toggle('hot', r === row);
}

function rowAt(x, y) {
  const node = document.elementFromPoint(x, y); // העותק המורם הוא pointer-events: none, ולכן לא חוסם
  return node?.closest?.('.mm-row') ?? null;
}

// לא פסיבי, ורק בזמן שהתפריט פתוח והאצבע עדיין למטה: חוסם גלילה של הרשימה שמתחת לשכבה
function dragSelectMove(event) {
  if (!mmFingerDown || !mmCurrent) return;
  event.preventDefault();
  const t = event.touches[0];
  if (t) setHotRow(rowAt(t.clientX, t.clientY));
}
function startDragSelect() {
  document.addEventListener('touchmove', dragSelectMove, { passive: false });
}
function stopDragSelect() {
  document.removeEventListener('touchmove', dragSelectMove, { passive: false });
}

// הקשה רגילה על שורה: אותה הדגשה
mmMenu.addEventListener('pointerdown', (event) => setHotRow(event.target.closest('.mm-row')));
for (const type of ['pointerup', 'pointercancel', 'pointerleave']) {
  mmMenu.addEventListener(type, () => { if (!mmFingerDown) setHotRow(null); });
}

// השחרור של האצבע שפתחה את התפריט: על שורה = מפעיל אותה; במקום אחר = לא סוגר, והספירה של 350ms מתחילה רק מהשחרור.
function fingerUp(event) {
  if (!mmFingerDown) return;
  mmFingerDown = false;
  stopDragSelect();
  const t = event?.type === 'touchend' ? event.changedTouches?.[0] : null;
  const row = t ? rowAt(t.clientX, t.clientY) : null;
  setHotRow(null);
  mmOpenedAt = Date.now();
  if (row && mmCurrent && !mmClosing) row.click(); // בתוך touchend, ולכן עדיין "פעולת משתמש" (העתקה ללוח עובדת)
}
document.addEventListener('touchend', fingerUp, { passive: true });
document.addEventListener('touchcancel', fingerUp, { passive: true });

// זכוכית מגדלת / סימון של iOS: מעבר ל-CSS, חוסמים את תחילת הסימון ואת תפריט המערכת על בועות (לא touchstart, כדי לא לשבור גלילה)
const holdEnd = () => feedEl.classList.remove('holding');
document.addEventListener('touchend', holdEnd, { passive: true });
document.addEventListener('touchcancel', holdEnd, { passive: true });
const elementOf = (target) => (target?.nodeType === 1 ? target : target?.parentElement ?? null);
const inBubble = (target) => Boolean(elementOf(target)?.closest('.me, .sysb'));
feedEl.addEventListener('selectstart', (event) => { if (inBubble(event.target)) event.preventDefault(); });
feedEl.addEventListener('contextmenu', (event) => { if (inBubble(event.target)) event.preventDefault(); });
mmEl.addEventListener('selectstart', (event) => event.preventDefault());

// לחיצה על הרקע (או על העותק) סוגרת
mmEl.addEventListener('click', (event) => {
  if (event.target.closest('.mm-menu')) return;
  if (mmFingerDown || Date.now() - mmOpenedAt < 350) return;
  closeMessageMenu();
});
mmEl.addEventListener('contextmenu', (event) => event.preventDefault());
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && mmCurrent) closeMessageMenu(); });

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch { /* ממשיכים לגיבוי */ }
  try {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;top:0;opacity:0;font-size:16px';
    document.body.append(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return ok;
  } catch { return false; }
}

document.getElementById('mmCopy').addEventListener('click', async () => {
  if (!mmCurrent || mmClosing) return;
  const ok = await copyText(mmCurrent.text);
  closeMessageMenu();
  showToast(ok ? 'הועתק' : 'לא הצלחתי להעתיק');
});

document.getElementById('mmReply').addEventListener('click', () => {
  if (!mmCurrent || mmClosing) return;
  const meta = mmCurrent;
  closeMessageMenu();
  startReply(meta);
});

// --- שורת הכתיבה למטה: הודעה חדשה (D2), נשלחת לנקודת הקליטה עם channel=app ---
let sending = false;
function showComposerNote(text) {
  composerNote.textContent = text;
  composerNote.hidden = !text;
}
msgInput.addEventListener('input', () => showComposerNote(''));

composer.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (sending) return; // הכפתור נעול עד שהשליחה מסתיימת, כדי שלחיצה כפולה לא תרשום הודעה פעמיים (35 "לוג פערים", 14.10.2026)
  const text = msgInput.value.trim();
  if (!text) return; // שדה ריק: לא שולחים
  sending = true;
  sendBtn.disabled = true;
  msgInput.readOnly = true;
  showComposerNote('');
  try {
    const fields = { text, channel: 'app' };
    // ציטוט ("הגב", ח-4): השרת היום מתעלם משדות Form נוספים (api/intake.js קורא רק text, channel, sender). השימוש בו בשרת: בלוק 3.
    if (quoted) { fields.reply_to = String(quoted.id); fields.reply_to_role = quoted.role; }
    const res = await authedFetch('/api/intake', {
      method: 'POST',
      body: new URLSearchParams(fields),
    });
    if (res.status === 413) {
      showComposerNote(TOO_LONG_TEXT);
    } else if (!res.ok) {
      showComposerNote(ERROR_TEXT);
    } else {
      msgInput.value = '';
      clearQuote();
      await refresh();
    }
  } catch (err) {
    // אין רשת, או שלא הוזן סוד: הטקסט נשאר בתיבה.
    console.warn('[app] שליחת הודעה נכשלה', err?.name);
    showComposerNote(ERROR_TEXT);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    msgInput.readOnly = false;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { paintDate(); scheduleMidnightPaint(); refresh(); }
});
// חזרה מ-bfcache (iOS): visibilitychange לא תמיד נורה.
window.addEventListener('pageshow', () => { paintDate(); scheduleMidnightPaint(); });

// ============================================================
// מסך היומן (בלוק 7 חלק א'-2): לצפייה בלבד. שינויים עוברים דרך הצ'אט, ולכן אין כאן כפתורי עריכה.
// נתונים: GET /api/chat?view=calendar&from=YYYY-MM-DD&days=N (lib/calendar-view.js). הטקסט נכנס רק דרך textContent.
// שיעורים והפסקות לא מוצגים ברשת החודש (⏸ לא הוכרע במפרט); הם מופיעים ברשימת היום בלבד.
// צבעי מקצועות: docs/02-rules/03-design-rules.md "צבעי המקצועות" (מילוי ודיו). למקצוע בלי צבע בפלטה: ניטרלי, בלי פס.
// [הנחה, לא אומת: פיזיקה וכימיה בצבע "מדעים", כי הפלטה לא מפרידה ביניהן. מדעי המחשב, חנ"ג, חינוך פיננסי, כישורי חיים ושיח אישי: בלי צבע, לפי המפרט.]
// ============================================================
const CAL_SUBJECTS = {
  'מתמטיקה': ['#6CA6CA', '#235E7F'], 'מדעים': ['#7ACBC8', '#2B807E'], 'פיזיקה': ['#7ACBC8', '#2B807E'], 'כימיה': ['#7ACBC8', '#2B807E'],
  'היסטוריה': ['#A9AE62', '#626614'], 'ערבית': ['#CC8C83', '#7F463E'], 'אנגלית': ['#FCA9BD', '#AB6073'],
  'עברית': ['#948EFD', '#5144AC'], 'ספרות': ['#BCA5DB', '#735D8F'], 'תנ"ך': ['#F69EFE', '#A754AF'], 'אזרחות': ['#E770A9', '#952361'],
};
const calSubjectColors = (subject) => CAL_SUBJECTS[String(subject ?? '').replace(/[״“”]/g, '"').trim()] ?? null;
const CAL_WEEKDAYS = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];
const CAL_TZ = 'Asia/Jerusalem';
const CAL_ERROR_TEXT = 'לא הצלחתי לטעון את היומן';
const calEl = document.getElementById('cal');
const calBodyEl = document.getElementById('calBody');
const calBarEl = document.getElementById('calBar');
const calState = { open: false, y: 0, m: 0, view: 'month', status: 'loading', data: null, day: null, openItem: null, req: 0 };

const calPad = (n) => String(n).padStart(2, '0');
const calIso = (y, m, d) => `${y}-${calPad(m + 1)}-${calPad(d)}`;
// התאריך של היום בשעון ישראל, YYYY-MM-DD
function calToday() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: CAL_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function calHm(iso) {
  if (!iso) return '';
  const at = new Date(iso);
  if (Number.isNaN(at.getTime())) return '';
  return new Intl.DateTimeFormat('en-GB', { timeZone: CAL_TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(at);
}
const calSvg = (path) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
function calButton(className, label, svgPath, text) {
  const b = el('button', className);
  b.type = 'button';
  if (label) b.setAttribute('aria-label', label);
  if (svgPath) b.insertAdjacentHTML('beforeend', calSvg(svgPath));
  if (text) b.append(document.createTextNode(text));
  return b;
}
function calSetColors(node, subject) {
  const c = calSubjectColors(subject);
  if (!c) return false;
  node.style.setProperty('--sf', c[0]);
  node.style.setProperty('--si', c[1]);
  return true;
}

// רשת החודש מתחילה בראשון שלפני (או ב-)1 לחודש, ו-42 ימים מכסים כל חודש.
function calGridStart(y, m) {
  const first = new Date(Date.UTC(y, m, 1));
  const start = new Date(Date.UTC(y, m, 1 - first.getUTCDay()));
  return calIso(start.getUTCFullYear(), start.getUTCMonth(), start.getUTCDate());
}

async function calLoad() {
  const req = ++calState.req;
  calState.status = 'loading';
  calState.data = null;
  calRender();
  try {
    const res = await authedFetch(`/api/chat?view=calendar&from=${calGridStart(calState.y, calState.m)}&days=42`);
    if (!res.ok) throw new Error('status ' + res.status);
    const data = await res.json();
    if (req !== calState.req) return;
    if (!data || !Array.isArray(data.days)) throw new Error('shape');
    calState.data = data;
    calState.status = 'ok';
  } catch (err) {
    if (req !== calState.req) return;
    console.warn('[app] טעינת היומן נכשלה', err?.name);
    calState.status = 'error';
  }
  calRender();
}

function calMonthCell(day, today) {
  const date = day.date;
  const inMonth = Number(date.slice(5, 7)) - 1 === calState.m;
  const cell = el('button', 'cal-day' + (inMonth ? '' : ' out') + (date === today ? ' today' : ''));
  cell.type = 'button';
  cell.setAttribute('aria-label', `${Number(date.slice(8))} ב${MONTHS[Number(date.slice(5, 7)) - 1]}`);
  cell.append(el('span', 'cal-n tnum', Number(date.slice(8))));
  const chips = [];
  let train = false;
  let evt = false;
  for (const item of day.items) {
    if (item.kind === 'exam') {
      const chip = el('span', 'cal-chip' + (item.quiz ? ' quiz' : '') + (item.makeup ? ' makeup' : ''), item.subject || item.title);
      if (item.makeup) { /* מועד ב': אפור לפי design-rules:401, בלי צבע מקצוע */ }
      else if (!calSetColors(chip, item.subject)) { chip.style.setProperty('--sf', 'var(--btn-neutral)'); chip.style.setProperty('--si', 'var(--label2)'); }
      chips.push(chip);
    } else if (item.pending) { const chip = el('span', 'cal-chip pending'); chip.append(el('span', 'ct', item.title), el('span', '', '?')); chips.push(chip); }
    else if (item.kind === 'training') train = true;
    else if (item.kind === 'event') evt = true;
    // שיעורים והפסקות: לא ברשת החודש (⏸ לא הוכרע במפרט).
  }
  chips.slice(0, 2).forEach((chip) => cell.append(chip));
  if (chips.length > 2) cell.append(el('span', 'cal-more tnum', `+${chips.length - 2}`));
  if (train || evt) {
    const dots = el('span', 'cal-dots');
    if (evt) dots.append(el('span', 'cal-dot'));
    if (train) dots.append(el('span', 'cal-dot train'));
    cell.append(dots);
  }
  cell.addEventListener('click', () => { calState.view = 'day'; calState.day = date; calState.openItem = null; calRender(); calBodyEl.scrollTop = 0; });
  return cell;
}

function calRenderMonth() {
  const today = calToday();
  const wd = el('div', 'cal-wd');
  CAL_WEEKDAYS.forEach((d) => wd.append(el('span', '', d)));
  const grid = el('div', 'cal-grid');
  calState.data.days.forEach((day) => grid.append(calMonthCell(day, today)));
  const nodes = [];
  const monthKey = `${calState.y}-${calPad(calState.m + 1)}`;
  const unknown = (calState.data.unknownExams ?? []).find((u) => u.month === monthKey);
  if (unknown) nodes.push(el('p', 'cal-note', unknown.text));
  nodes.push(wd, grid);
  calBodyEl.replaceChildren(...nodes);
}

function calItemNode(item, index) {
  const b = el('button', 'cal-item');
  b.type = 'button';
  const open = calState.openItem === index;
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  const row = el('div', 'cal-row');
  const from = calHm(item.start);
  const to = calHm(item.end);
  if (item.kind === 'break') {
    b.classList.add('brk');
    const brk = el('span', 'cal-title tnum');
    if (from && to) brk.append(el('span', 'ltr', `${from}–${to}`), document.createTextNode(' · הפסקה')); else brk.append(document.createTextNode('הפסקה'));
    row.append(brk);
  } else {
    if (item.kind === 'lesson') {
      b.classList.add('lesson');
      calSetColors(b, item.subject); // בלי צבע בפלטה: בלי פס
    } else if (item.kind === 'exam') {
      b.classList.add('exam');
      if (item.quiz) b.classList.add('quiz');
      if (item.makeup) b.classList.add('makeup'); // מועד ב': אפור (design-rules:401)
      else if (!calSetColors(b, item.subject)) b.classList.add('noclr');
    } else if (item.pending) b.classList.add('pending');
    else b.classList.add(item.kind === 'training' ? 'train' : 'evt');
    const timeNode = el('span', 'cal-time tnum ltr', from || 'כל היום');
    if (!from) timeNode.classList.remove('ltr');
    row.append(timeNode, el('span', 'cal-title', item.title));
    if (item.pending) row.append(el('span', 'cal-tag', 'ממתין לתשובה'));
    else if (item.kind === 'exam' && !item.makeup) row.append(el('span', 'cal-tag', item.quiz ? 'מבדק' : 'מבחן'));
  }
  b.append(row);
  if (open) {
    const detail = [];
    // שורות: [תווית, ערך, ערך משמאל לימין?]
    if (from) detail.push(['שעה', to ? `${from}–${to}` : from, true]); else if (item.kind !== 'break') detail.push(['שעה', 'כל היום', false]);
    if (item.subject) detail.push(['מקצוע', item.subject, false]);
    if (item.room) detail.push(['חדר', item.room, false]);
    if (item.pending) detail.push(['סטטוס', 'ממתין לתשובה שלך בצ\'אט', false]);
    const det = el('div', 'cal-det');
    detail.forEach(([label, value, ltr], i) => {
      if (i) det.append(document.createElement('br'));
      det.append(document.createTextNode(`${label}: `), el('span', ltr ? 'ltr' : '', value));
    });
    b.append(det);
  }
  b.addEventListener('click', () => { calState.openItem = open ? null : index; calRender(); });
  return b;
}

function calRenderDay() {
  const day = calState.data.days.find((d) => d.date === calState.day);
  const list = el('div', 'cal-list');
  if (!day || day.items.length === 0) list.append(el('p', 'rvempty', 'אין כלום ביום הזה'));
  else day.items.forEach((item, i) => list.append(calItemNode(item, i)));
  calBodyEl.replaceChildren(list);
}

function calRender() {
  // סרגל: חודש = קודם / שם החודש / הבא. יום = חזרה לחודש / תאריך.
  calBarEl.replaceChildren();
  if (calState.view === 'day' && calState.status === 'ok') {
    const back = calButton('cal-btn', 'חזרה לחודש', '<path d="M9 6l6 6-6 6"/>', 'חודש');
    back.addEventListener('click', () => { calState.view = 'month'; calState.openItem = null; calRender(); });
    const [y, m, d] = calState.day.split('-').map(Number);
    const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    calBarEl.append(back, el('h2', 'tnum', `יום ${DAYS[wd]}, ${d} ב${MONTHS[m - 1]}`));
  } else {
    const prev = calButton('cal-btn', 'החודש הקודם', '<path d="M9 6l6 6-6 6"/>');
    const next = calButton('cal-btn', 'החודש הבא', '<path d="M15 6l-6 6 6 6"/>');
    prev.addEventListener('click', () => calShift(-1));
    next.addEventListener('click', () => calShift(1));
    calBarEl.append(prev, el('h2', 'tnum', `${MONTHS[calState.m]} ${calState.y}`), next);
  }
  if (calState.status === 'loading') { calBodyEl.replaceChildren(el('p', 'rvempty', 'טוען…')); return; }
  if (calState.status === 'error') {
    const retry = el('button', 'cal-btn', 'נסה שוב');
    retry.type = 'button';
    retry.addEventListener('click', calLoad);
    const box = el('div', 'loaderr', CAL_ERROR_TEXT);
    box.append(retry);
    calBodyEl.replaceChildren(box);
    return;
  }
  if (calState.view === 'day') calRenderDay(); else calRenderMonth();
}

function calShift(delta) {
  const at = new Date(Date.UTC(calState.y, calState.m + delta, 1));
  calState.y = at.getUTCFullYear();
  calState.m = at.getUTCMonth();
  calState.view = 'month';
  calLoad();
}

function openCalendar() {
  const [y, m] = calToday().split('-').map(Number);
  calState.open = true;
  calState.y = y; calState.m = m - 1; calState.view = 'month'; calState.openItem = null;
  calEl.hidden = false;
  calBodyEl.scrollTop = 0;
  calLoad();
  document.getElementById('calClose').focus();
}
function closeCalendar() {
  calState.open = false;
  calState.req++;
  calEl.hidden = true;
  calBodyEl.replaceChildren();
  document.getElementById('calOpen').focus(); // הפוקוס חוזר לאייקון (תיקון אחרי הבודק)
}
document.getElementById('calOpen').addEventListener('click', openCalendar);
document.getElementById('calClose').addEventListener('click', closeCalendar);
document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && calState.open) closeCalendar(); });

refresh();
</script>
</body>
</html>
